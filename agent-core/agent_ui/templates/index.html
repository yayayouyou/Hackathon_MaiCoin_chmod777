<title>MAIA · MAX AI 交易特助</title>
<!-- PWA：可安裝、獨立視窗、離線可開 app shell -->
<meta name="theme-color" content="#2E4592">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ================================================================
   MAIA 設計語言 — 幣安骨架 × Coinbase 藍（方向 D）
   ----------------------------------------------------------------
   核心決策：幣安整套系統靠「單一亮黃打在近黑上」產生電壓，但藍是暗色，
   直接替換會失去對比（實測對畫布：幣安黃 13.55:1、Coinbase 藍 3.36:1、
   MAX 藍 2.20:1）。因此**藍必須拆成兩階**：
     --accent    #0052FF  填色藍：只當實心按鈕/標籤的底，白字打上去（5.75:1）
     --accent-2  #6E9CFF  墨水藍：深色面上的文字/連結/焦點環（對卡面 5.92:1）
   這是對幣安的反轉——它是黑字打在黃底，我們是白字打在藍底。
   MAX 品牌藍 #2E4592 太暗（2.20:1），只保留給品牌標誌底板，不當 UI 色。

   景深：扁平。不用陰影、不用氛圍漸層。深度來自 --bg 與 --surface 的色塊對比
   （幣安的核心哲學：trusts color-block contrast, not atmospheric depth）。
   ================================================================ */
:root {
  /* color-scheme: dark 是必要的，不是裝飾。
     沒有它，瀏覽器會對 UA 樣式套用「淺色模式」預設值：
       <button> → color: buttontext  = 黑色  → 歡迎頁的能力卡標題是黑字（對比 1.26:1）
       <a>      → color: -webkit-link = #0000EE → 跑馬燈價格是連結藍（對比 1.9:1）
     這就是「畫面有黑色文字」「價格看不清楚」的真正原因。 */
  color-scheme: dark;

  --max-blue: #2E4592;              /* MAX 品牌藍：僅供標誌底板，對畫布僅 2.20:1 */
  --accent: #0052FF;                /* 填色藍（Coinbase 原值）：只當底，配白字 */
  --accent-2: #6E9CFF;              /* 墨水藍：深色面上的文字/連結/焦點 */
  --accent-dim: #1E3A8F;

  /* 表面：幣安近黑（帶微暖，非純黑）+ 色塊分階。邊框與 elevated 同值 ——
     幣安的邊框是「表面台階」而非墨線，這是它扁平哲學的一部分。 */
  --bg: #0B0E11;
  --surface: #1E2329;
  --surface-2: #2B3139;
  --surface-3: #363D47;
  --border: #2B3139;
  --border-2: #363D47;

  /* 文字階層（全部實測對 --surface 的對比） */
  --ink: #EAECEF;        /* 主要：數值、標題 — 13.36:1 */
  --ink-2: #B7BDC6;      /* 次要：說明文字 */
  --ink-3: #929AA5;      /* 三級：標籤 — 5.56:1，承載資訊的標籤一律用這階 */
  --ink-4: #707A8A;      /* 僅供裝飾，不得承載資訊 —— 幣安原系統用它當 muted，
                            但對 --surface 只有 3.65:1，未達 AA。我們不繼承這個錯誤。 */
  --grid: rgba(234, 236, 239, .06);
  /* 幣安是扁平系統：深度來自色塊對比，不是陰影。保留變數但設為 none，
     讓既有引用 var(--shadow) 的元件自動變扁平，不必逐一改。 */
  --shadow: none;

  /* 漲跌：綠用幣安原值；紅刻意用比幣安 #F6465D 亮一階的 #FF7185。
     原因（實測）：#F6465D 對 --bg 是 5.49:1 但對 --surface 只有 4.48:1、
     對 --surface-2 只有 3.72:1，而本站的損益數字大量落在卡片與 elevated 面上。
     #FF7185 在三個面分別是 7.33 / 5.99 / 4.97:1，全部通過 AA。
     綠色不需補階（9.10 / 7.44 / 6.17:1 本來就過）——這組語意色天生不對稱，
     因為紅本來就比綠暗。 */
  /* 漲跌基礎色（綠/紅）；--up/--down 引用它們，方向語意固定＝漲用 --up、跌用 --down。
     東方習慣（紅漲綠跌）只要 data-color-convention="eastern" 交換兩者引用，全站(含圖表/跑馬燈閃爍)自動跟著變。 */
  --c-green: #0ECB81;
  --c-red: #FF7185;
  --up: var(--c-green);
  --down: var(--c-red);
  --warn: #E8A03D;      /* 對帳缺口/警示：獨立於漲跌之外，差異不是損益 */

  /* 衍生色（用 color-mix 從主色推導 → 改一次主色，全站跟著變。
     舊版把 var(--up-line) 這種字面值散在 16 個地方，改色必漏） */
  --up-bg:     color-mix(in srgb, var(--up) 12%, transparent);
  --up-line:   color-mix(in srgb, var(--up) 34%, transparent);
  --down-bg:   color-mix(in srgb, var(--down) 12%, transparent);
  --down-line: color-mix(in srgb, var(--down) 36%, transparent);
  --warn-bg:   color-mix(in srgb, var(--warn) 10%, transparent);
  --warn-line: color-mix(in srgb, var(--warn) 38%, transparent);
  --accent-bg: color-mix(in srgb, var(--accent) 11%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 30%, transparent);
  /* 實色底上的文字（需 ≥4.5:1；深色前景配亮色底） */
  --on-up: #04231A;
  --on-down: #3A0710;
  --on-warn: #2A1A00;
  --on-accent: #FFFFFF;   /* 白字打在填色藍上 = 5.75:1（幣安是黑字打黃底，我們反轉） */

  /* 圖表分類色 —— 固定順序指派，絕不循環。
     **沒有藍色**：實測墨水藍 #6E9CFF 與一般圖表藍 #3987E5 只差 ΔE 8.6（門檻 15），
     連正常色覺都分不出來 → 品牌色是藍色時，圖表就不能用藍色畫資料。
     這五色對 --surface 通過全部六項驗證（最差相鄰 CVD ΔE 13.2、一般視覺 19.3）。
     第 6 個序列不得自動生成新色，一律折成「其他」（--c6 中性灰）。 */
  --c1: #D95926; --c2: #9085E9; --c3: #D55181;
  --c4: #C98500; --c5: #00A5C4; --c6: #8A94A6;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI",
          "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono",
          "PingFang TC", "Noto Sans TC", monospace;
  /* 幣安的緊湊圓角尺度（原本 14px/10px 偏軟，接近行銷網站而非交易平台） */
  --r: 8px;         /* 卡片 */
  --r-sm: 6px;      /* 按鈕、輸入 */
  --r-shell: 12px;  /* 大型容器 */
  --r-badge: 4px;   /* 小徽章 */
}
/* ☀ 淺色主題：由 <html data-theme="light"> 啟用（切換鈕寫入 localStorage）。
   維持金融場景可讀性：冷調中性 + MAX 藍 + 漲跌加深以在白底維持對比。
   衍生色 (--up-bg / --accent-line 等) 由 color-mix 從主色推導，會自動跟著變。 */
:root[data-theme="light"] {
  color-scheme: light;
  /* 兩階藍在淺色模式**反轉**：白底上填色藍 #0052FF 自己就是可讀的文字色（8.6:1），
     而墨水藍 #6E9CFF 在白底只有 2.2:1 —— 禁止當文字。
     所以這裡 --accent 與 --accent-2 都指向填色藍系，--accent-2 略深以供 hover/強調。
     這就是「兩階藍要記四條規則」的地方，靠語意 token 自動換值來吸收。 */
  --accent: #0052FF; --accent-2: #003ECC; --accent-dim: #A8B8CC;
  --bg: #F5F5F5; --surface: #FFFFFF; --surface-2: #FAFAFA; --surface-3: #EAECEF;
  --border: #EAECEF; --border-2: #CDD1D6;
  --ink: #181A20; --ink-2: #474D57; --ink-3: #5E6673; --ink-4: #929AA5;
  --grid: rgba(24, 26, 32, .08);
  /* 淺色的漲跌必須加深：#0ECB81 在白底只有 2.13:1、#FF7185 只有 2.6:1，都不可用 */
  --c-green: #017A4F; --c-red: #C7253C; --warn: #9A6206;
  --on-up: #FFFFFF; --on-down: #FFFFFF; --on-warn: #FFFFFF;
  --shadow: none;    /* 扁平系統：淺色也不用陰影，靠 hairline 分界 */
}
/* 主題切換時，底色/邊框/文字平滑過渡（避免硬切） */
body, .histbar, .chat, .dock, .topbar, .chart-card, .cap, .bubble, .settings-pop {
  transition: background-color .25s ease, border-color .25s ease, color .2s ease;
}
/* 東方漲跌習慣：紅漲綠跌（交換 --up/--down 引用；.up/.down、圖表 C.up/down、跑馬燈閃爍全自動跟隨） */
:root[data-color-convention="eastern"] { --up: var(--c-red); --down: var(--c-green); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
/* UA 預設色的第二道防線：即使 color-scheme 失效，按鈕/連結也不會掉回黑字/連結藍 */
button, a, input, select, textarea { color: inherit; }
a { text-decoration: none; }
body {
  background: var(--bg);   /* 扁平：不用氛圍漸層，深度來自 --bg 與 --surface 的色塊對比 */
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  letter-spacing: .1px;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.up   { color: var(--up); }
.down { color: var(--down); }
::selection { background: rgba(91, 124, 250, .35); }
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-2); }

/* ---------------- Top bar ---------------- */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);   /* 扁平實色，不用半透明玻璃感 */
  flex-shrink: 0; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.max-mark {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--max-blue); color: #fff;
  font-weight: 800; letter-spacing: 1px; font-size: 14px;
  padding: 5px 9px; border-radius: 8px;
  /* 扁平：品牌標誌不發光 */
}
.brand .x { color: var(--ink-3); font-weight: 600; }
.brand .maia { font-weight: 800; font-size: 15.5px; letter-spacing: .4px; }
.brand .maia b {
  background: linear-gradient(90deg, var(--accent), var(--accent-2));   /* token 化 → 淺色下仍可讀 */
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand .tag { font-size: 11px; color: var(--ink-2); margin-left: 2px; white-space: nowrap; }

/* ---- 即時行情列 ----
   實測 OKX / Binance / MAX：三家的報價條都是「靜態」的，而且階層是
   「標籤壓暗、數值最亮」。舊版剛好反過來（代號亮、價格是瀏覽器連結藍），
   再加上 55 秒無限捲動 —— 會動的數字本來就沒法讀。
   這裡：價格 = 全畫面最亮 + mono 等寬；代號壓到 ink-3；漲跌做成有底色的膠囊；
   捲動放慢到 180s，且 hover / 分頁隱藏 / reduced-motion 都會停。 */
.ticker {
  overflow: hidden; flex: 1 1 auto; min-width: 0;
  /* 上限 = 兩三檔的寬度。原本 flex:1 會吃光剩餘空間，把兩端的幣別切掉一半 ——
     跑馬燈本來就是掃視用的，不需要一次塞下 10 檔。 */
  max-width: 420px;
  /* 淡出範圍要夠寬，滾動中的項目才會『淡出』而不是被硬切在字中間 */
  mask-image: linear-gradient(90deg, transparent, #000 46px, #000 calc(100% - 46px), transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 46px, #000 calc(100% - 46px), transparent);
}
@media (max-width: 1100px) { .ticker { max-width: 260px; } }
@media (max-width: 860px)  { .ticker { display: none; } }   /* 窄畫面把空間讓給帳戶與輸入 */
.ticker-track {
  display: inline-flex; gap: 8px; align-items: center; will-change: transform;
  animation: tickerScroll 180s linear infinite;   /* 55s → 180s：慢到可以讀 */
}
.ticker:hover .ticker-track,
.ticker-track.paused { animation-play-state: paused; }   /* 滑上去就停；分頁切走也停 */
@keyframes tickerScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
/* 價格較上次更新變動時閃一下（漲=--up、跌=--down；顏色吃漲跌色設定，再回歸原色） */
@keyframes tkflash-up   { 0%,22% { color: var(--up); }   100% { color: var(--ink); } }
@keyframes tkflash-down { 0%,22% { color: var(--down); } 100% { color: var(--ink); } }
@keyframes tkbg-up   { 0%,22% { background: color-mix(in srgb, var(--up) 16%, transparent); }   100% { background: transparent; } }
@keyframes tkbg-down { 0%,22% { background: color-mix(in srgb, var(--down) 16%, transparent); } 100% { background: transparent; } }
.tk.flash-up  .px { animation: tkflash-up .9s ease-out; }
.tk.flash-down .px { animation: tkflash-down .9s ease-out; }
.tk.flash-up  { animation: tkbg-up .9s ease-out; }
.tk.flash-down { animation: tkbg-down .9s ease-out; }
.tk {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 6px 4px 10px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface); white-space: nowrap; flex-shrink: 0;
  cursor: pointer; transition: border-color .15s, background .15s;
}
.tk:hover { border-color: var(--accent-dim); background: var(--surface-2); }
/* 代號：標籤角色 → 壓暗、縮小，讓出視覺權重給價格 */
.tk .sym { font-weight: 700; font-size: 10.5px; color: var(--ink-3); letter-spacing: .5px; }
/* 價格：主角 → 最亮的 ink、等寬對齊、加粗 */
.tk .px  {
  font-size: 13px; font-weight: 700; color: var(--ink);
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  letter-spacing: -.2px;
}
/* 漲跌：膠囊底色 —— 光靠文字顏色，10px 的小字在暗底上辨識度不夠 */
.tk .chg {
  font-size: 10.5px; font-weight: 800;
  font-variant-numeric: tabular-nums;
  padding: 2px 7px; border-radius: 999px;
}
.tk .chg.up   { color: var(--up);   background: var(--up-bg); }
.tk .chg.down { color: var(--down); background: var(--down-bg); }

.top-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--border-2); color: var(--ink-2); background: var(--surface);
  white-space: nowrap;
}
.pill.risk-paper { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
.pill.risk-live  { color: var(--down); border-color: var(--down-line); background: var(--down-bg); }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--up) 45%, transparent); }
  70%  { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.icon-btn {
  width: 32px; height: 32px; border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--border);
  color: var(--ink-2); font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s;
}
.icon-btn:hover { border-color: var(--accent-2); color: var(--ink); }
.icon-btn.active { border-color: var(--accent); color: var(--accent-2); }

.notice-bar {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--border-2);
  border-radius: var(--r-sm); padding: 10px 16px; font-size: 12.5px; z-index: 300;
  opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
  max-width: min(92vw, 460px); text-align: center;
}
.notice-bar.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .notice-bar { transition: none; } }

/* ── 答案來源標記（E）：把信任做成看得見的東西 ──
   金融答案的每個數字都該能追回原始紀錄。這排 chip 顯示本輪實際跑過的工具、
   以及可稽核的事實（對帳狀態、帳本筆數、配對法），點擊展開細節。 */
.prov { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); }
.prov-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.prov-lead { font-size: 10px; font-weight: 700; color: var(--ink-3); letter-spacing: .07em; }
.prov-chip {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: 11px; color: var(--ink-2); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--r-sm); padding: 3px 9px;
  transition: border-color .15s, color .15s;
}
.prov-chip:hover, .prov-chip.open { border-color: var(--accent-2); color: var(--ink); }
.prov-chip .pc-n {
  font-family: var(--mono); font-size: 9px; font-weight: 700; color: var(--accent-2);
  border: 1px solid var(--border-2); border-radius: 3px; padding: 0 3px; line-height: 1.5;
}
.prov-chip .pc-m { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.prov-chip.warn .pc-m { color: var(--warn); }
.prov-time { margin-left: auto; font-size: 10px; color: var(--ink-4); }
.prov-body {
  margin-top: 8px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 9px 11px;
}
.prov-body[hidden] { display: none; }
.pb-tool { font-size: 10px; color: var(--ink-4); margin-bottom: 6px; }
.pb-row { display: flex; gap: 12px; font-size: 11.5px; padding: 3px 0; }
.pb-row + .pb-row { border-top: 1px dashed var(--border); }
.pb-k { color: var(--ink-3); }
.pb-v { margin-left: auto; color: var(--ink); font-weight: 600; }
.pb-v.warn { color: var(--warn); }
/* 分級免責：固定元件，依風險等級換用語與視覺強度 */
.prov-disc {
  margin-top: 9px; font-size: 10.5px; line-height: 1.55; color: var(--ink-4);
  border-left: 2px solid var(--border-2); padding-left: 9px;
}
.prov-disc.acct { color: var(--ink-3); border-left-color: var(--warn); }
.prov-disc.exec { color: var(--ink-2); border-left-color: var(--down); font-weight: 600; }

/* ── 空狀態工作台：真實數字取代功能型錄 ── */
.desk { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.desk[hidden] { display: none; }
.desk-strip { display: flex; gap: 10px; flex-wrap: wrap; }
.dk { flex: 1; min-width: 168px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px; text-align: left; }
.dk-k { display: block; font-size: 10px; color: var(--ink-3); font-weight: 700; letter-spacing: .05em; }
.dk-v { display: block; font-size: 25px; font-weight: 800; margin-top: 4px; letter-spacing: -.02em; }
.dk-s { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 3px; }
.desk-ask { font-size: 10.5px; color: var(--ink-3); font-weight: 700; letter-spacing: .07em; text-align: left; }
.desk-qs { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-start; }
.dq { background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
      padding: 7px 14px; font-size: 12.5px; color: var(--ink-2); transition: border-color .15s, color .15s; }
.dq:hover { border-color: var(--accent-2); color: var(--ink); }
.dq.hot { border-color: var(--accent); color: var(--ink); }   /* 由你的實際狀態生成的題目 */
.cap-grid[hidden] { display: none; }

/* ── 系統狀態：一顆點取代模型ID／模式徽章／連線文字三個常駐位置 ── */
.sysdot {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 11px 4px 9px; font-size: 11px; font-weight: 600; color: var(--ink-3);
  transition: border-color .15s, color .15s;
}
.sysdot:hover, .sysdot[aria-expanded="true"] { border-color: var(--accent-2); color: var(--ink-2); }
.sysdot .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none;
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--warn) 50%, transparent); animation: pulse 2.2s infinite;
}
.sysdot .dot.ok  { background: var(--up); }
.sysdot .dot.err { background: var(--down); animation: none; }
:root[data-risk="live"] .sysdot { color: var(--down); border-color: var(--down); }
.syspop {
  position: fixed; z-index: 60; min-width: 232px;   /* 位置由 JS 對齊到狀態點 */
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 6px; display: flex; flex-direction: column;
}
.syspop[hidden] { display: none; }
.sysrow { display: flex; align-items: center; gap: 12px; padding: 7px 9px; font-size: 12px; border-radius: var(--r-badge); }
.sysrow + .sysrow { border-top: 1px solid var(--border); }
.sysk { color: var(--ink-3); }
.sysv { margin-left: auto; color: var(--ink); font-weight: 600; text-align: right; }
.syslink { color: var(--accent-2); font-weight: 600; }
.syslink:hover { background: var(--bg); }

/* ── 帳戶入口：最重要的數字（未實現損益）直接放在第一屏 ── */
.acct-btn {
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 3px 12px 3px 3px; transition: border-color .15s;
}
.acct-btn:hover { border-color: var(--accent-2); }
.acct-ava {
  width: 22px; height: 22px; border-radius: 50%; background: var(--max-blue); color: #fff;
  display: grid; place-items: center; font-size: 10px; font-weight: 800; flex: none;
}
.acct-pnl { font-size: 12px; font-weight: 700; }
.acct-k { font-size: 10px; color: var(--ink-3); }
@media (max-width: 720px) { .acct-k, .sysdot-txt { display: none; } .syspop { right: 12px; } }

/* ---------------- Settings popover ---------------- */
.settings-pop {
  position: fixed; top: 56px; right: 16px; width: 320px;
  background: var(--surface-2); border: 1px solid var(--border-2);
  border-radius: var(--r); box-shadow: var(--shadow);
  padding: 16px; z-index: 60;
  opacity: 0; visibility: hidden; transform: translateY(-10px) scale(.985); transform-origin: top right;
  transition: opacity .16s ease, transform .2s cubic-bezier(.2, .7, .3, 1), visibility 0s .2s;
}
.settings-pop.open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }

/* 帳戶總覽 Modal（點左下角使用者列彈出） */
.dash-modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px;
  background: color-mix(in srgb, #000 66%, transparent);
  opacity: 0; visibility: hidden; transition: opacity .18s ease, visibility 0s .18s; }
.dash-modal.open { opacity: 1; visibility: visible; transition-delay: 0s; }
.dash-card { width: min(560px, 94vw); max-height: 86vh; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r);
  box-shadow: var(--shadow); overflow: hidden; transform: translateY(10px) scale(.99);
  transition: transform .2s cubic-bezier(.2, .7, .3, 1); }
.dash-modal.open .dash-card { transform: none; }
.dash-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.dash-title { font-weight: 700; font-size: 15px; }
#dash-modal-body { padding: 16px 18px 20px; overflow-y: auto; }
.dash-donut-wrap { display: flex; gap: 18px; align-items: center; margin: 4px 0 8px; }
.dash-donut-wrap canvas { width: 150px; height: 150px; flex-shrink: 0; }
.dash-legend { flex: 1; min-width: 0; }
.dash-total { font-size: 11.5px; color: var(--ink-3); margin-bottom: 8px; }
.dash-total b { color: var(--ink); font-size: 19px; font-family: var(--mono); display: block; font-variant-numeric: tabular-nums; }
.dl-row { display: flex; align-items: center; gap: 7px; font-size: 12.5px; margin: 3px 0; color: var(--ink-2); }
.dl-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
.dl-row .num { margin-left: auto; color: var(--ink); }
.hb-user { cursor: pointer; border-radius: 8px; }
.hb-user:hover { background: var(--bg); }
.settings-pop h4 { margin: 0 0 12px; font-size: 12.5px; letter-spacing: .6px; color: var(--ink-2); text-transform: uppercase; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.field input, .field select {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 11px;
  color: var(--ink); font-family: inherit; font-size: 12.5px; outline: none;
  transition: border-color .15s;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.btn {
  border: none; border-radius: 9px; padding: 9px 14px;
  font-size: 12.5px; font-weight: 700;
  transition: background .15s, color .15s, border-color .15s;
}
.btn.primary { background: var(--max-blue); color: #fff; width: 100%; }   /* 白字 8.8:1（accent 藍只有 3.7:1，不過 AA） */
.btn.primary:hover { background: var(--accent); }
.btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--border-2); width: 100%; margin-top: 8px; }
.btn.ghost:hover { color: var(--down); border-color: var(--down-line); }
.safety {
  margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-2);
  font-size: 11.5px; color: var(--ink-3); line-height: 1.7;
}
.safety b { color: var(--ink-2); }

/* ---------------- Stage ---------------- */
.stage {
  display: flex; flex: 1; min-height: 0;
  gap: 16px; padding: 16px 20px;
  max-width: 1600px; margin: 0 auto; width: 100%;
}

/* ---------------- Chat ---------------- */
.chat {
  flex: 1; min-width: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  display: flex; flex-direction: column; overflow: hidden;
}
.thread {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 20px 18px;
  display: flex; flex-direction: column; gap: 16px;
}
/* 對話置中窄欄（現代 LLM 對話流）：thread 直接子元素統一收在置中窄欄，
   不再吃滿整個寬版，閱讀動線更集中、更貼近 Claude/ChatGPT。 */
.thread > .msg,
.thread > .chart-card,
.thread > .approval-card,
.thread > .reader-alert {
  width: 100%; max-width: 768px; margin-inline: auto;
}

/* 歡迎狀態 */
.welcome { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px; gap: 8px; margin: auto; width: 100%; }
.welcome .orb {
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(135deg, var(--accent), var(--max-blue));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 21px; color: #fff;
}
.welcome h1 { margin: 10px 0 0; font-size: 21px; letter-spacing: .3px; text-wrap: balance; }
.welcome h1 b {
  background: linear-gradient(90deg, var(--accent-2), #C3CDFF);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.welcome .sub { font-size: 12.5px; color: var(--ink-2); max-width: 480px;
  line-break: strict; text-wrap: pretty; }   /* 避免把「圖表」這種詞拆到兩行 */
.cap-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px; width: 100%; max-width: 560px; margin-top: 18px;
}
.cap {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 12px; padding: 13px 14px; text-align: left;
  box-shadow: var(--shadow);
  transition: border-color .15s, transform .15s, box-shadow .15s; cursor: pointer;
}
.cap:hover { border-color: var(--accent); transform: translateY(-2px); }
.cap .ic { font-size: 17px; }
.cap .t { font-weight: 700; font-size: 13px; margin-top: 6px; color: var(--ink); }   /* 一定要明寫：button 的 UA 預設字色是黑的 */
.cap .d { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.55; }

/* 訊息 */
.msg { display: flex; align-items: flex-start; gap: 10px; max-width: 100%; animation: rise .32s cubic-bezier(.2, .7, .3, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg .ava {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 800;
}
.msg.user { flex-direction: row-reverse; }
.msg.user .ava { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
.msg.bot .ava  { background: linear-gradient(135deg, var(--accent), var(--max-blue)); color: #fff; }
.bubble {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 12px; padding: 11px 14px;
  font-size: 13.5px; max-width: 82%; min-width: 0;
  overflow-wrap: break-word;
}
.msg.user .bubble { background: var(--surface-3); border-color: var(--border-2); }
.bubble .md-h { font-weight: 800; margin: 10px 0 4px; font-size: 14px; }
.bubble .md-h:first-child { margin-top: 0; }
.bubble .md-p { margin: 0 0 8px; }
.bubble .md-p:last-child { margin-bottom: 0; }
.bubble ul.md-ul, .bubble ol.md-ol { margin: 4px 0 8px; padding-left: 20px; }
.bubble ul.md-ul { list-style: none; padding-left: 16px; }
.bubble ul.md-ul > li { position: relative; margin: 2px 0; }
.bubble ul.md-ul > li::before {
  content: ""; position: absolute; left: -12px; top: 8px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}
.bubble ol.md-ol { list-style: decimal; }
.bubble ol.md-ol > li { margin: 2px 0; padding-left: 3px; }
.bubble ol.md-ol > li::marker { color: var(--accent); font-weight: 700; }
.bubble .md-ul ul, .bubble .md-ul ol, .bubble .md-ol ul, .bubble .md-ol ol { margin: 2px 0; }
.bubble .md-pre {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin: 6px 0 9px; overflow-x: auto;
}
.bubble .md-pre code { background: none; border: 0; padding: 0; font-size: 12px; color: var(--ink); white-space: pre; }
.bubble .md-table {
  border-collapse: collapse; margin: 6px 0 9px; font-size: 12.5px;
  display: block; overflow-x: auto; max-width: 100%;
}
.bubble .md-table th, .bubble .md-table td {
  border: 1px solid var(--border); padding: 5px 9px; text-align: left; white-space: nowrap;
}
.bubble .md-table th { background: var(--surface-3); color: var(--ink); font-weight: 700; }
.bubble a { color: var(--accent); text-decoration: none; }
.bubble a:hover { text-decoration: underline; }
.bubble code {
  font-family: var(--mono); font-size: 12px;
  background: var(--surface-3); border: 1px solid var(--border);
  padding: 1px 5px; border-radius: 5px;
}
.bubble.error { border-color: var(--down-line); color: var(--down); }

/* 泡泡內的工具 chips（即時出現） */
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 9px; }
.tools:empty { display: none; }
.tool-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10.5px; font-family: var(--mono);
  color: var(--accent-2); background: var(--accent-bg);
  border: 1px solid var(--accent-line);
  padding: 3px 8px; border-radius: 7px;
}
.tool-chip .spin {
  width: 9px; height: 9px; border-radius: 50%;
  border: 1.5px solid rgba(138,160,255,.35); border-top-color: var(--accent-2);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.tool-chip.done { color: var(--up); background: var(--up-bg); border-color: var(--up-line); }
.tool-chip.fail { color: var(--down); background: var(--down-bg); border-color: var(--down-line); }

/* 思考中 */
.thinking { display: flex; flex-direction: column; gap: 6px; }
.thinking .think-head { display: flex; align-items: center; gap: 8px; }
.thinking .spinner {
  width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid color-mix(in srgb, var(--accent) 22%, transparent);
  border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
.thinking .stat { font-size: 11px; color: var(--ink-3); }
.thinking .stat .num { color: var(--ink-2); }
.thinking .warm { font-size: 11px; color: var(--warn); display: none; }

/* 圖表卡片（嵌入對話流） */
.chart-card {
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border-2); border-radius: 12px;
  padding: 15px 18px 17px; width: 100%;          /* 填滿對話欄 — 原本 720px 上限在 1000px 欄寬下留了 300px 死空間 */
  box-shadow: var(--shadow);                     /* 景深：讓卡片浮起，更有質感 */
  animation: rise .32s cubic-bezier(.2, .7, .3, 1);
}
/* 標頭：eyebrow（分類）→ 標題 → 資料來源，三層一眼可辨 */
.chart-card .head {
  display: grid; grid-template-columns: 1fr auto; align-items: center;
  gap: 4px 12px; margin-bottom: 13px;
  padding-bottom: 11px; border-bottom: 1px solid var(--border);
}
.chart-card .head .eyebrow {
  grid-column: 1; grid-row: 1;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--accent-2); font-weight: 800;
}
.chart-card .head .t { grid-column: 1; grid-row: 2; font-weight: 800; font-size: 15px; letter-spacing: .2px; line-height: 1.3; }
.chart-card .head .src {
  grid-column: 2; grid-row: 1 / span 2; align-self: center;
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-3); background: var(--surface-3);
  border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px;
  white-space: nowrap;
}
.pane { width: 100%; }
.pane-canvas { position: relative; width: 100%; }
/* 雙窗格：加分隔線 + 窗格標籤，避免兩個 Y 軸被誤讀成同一條座標軸 */
.pane + .pane { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
.pane-label {
  font-size: 9.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 5px;
}
.gauge-center {
  position: absolute; left: 0; right: 0; bottom: 4px;
  text-align: center; pointer-events: none;
}
.gauge-center .v { font-size: 38px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.gauge-center .s { font-size: 12px; font-weight: 700; margin-top: 4px; letter-spacing: .3px; }
/* 儀表兩端刻度：沒有它，使用者不知道 22 是滿分 100 裡的 22 還是別的量綱。
   放在 canvas 下方（非 overlay）—— 疊上去會跟半圓的兩個端點打架 */
/* 恐貪儀表（SVG）：寬度收斂到 300px —— 這是一個「單一數值」的圖，
   撐滿卡寬只會讓弧線孤零零浮在中間。 */
.fng-wrap { max-width: 300px; margin: 2px auto 0; }
.fng-wrap svg { display: block; width: 100%; height: auto; }
.fng-legend {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px;
  margin-top: 6px; font-size: 10px; color: var(--ink-4); font-weight: 600;
}
.fng-legend span { display: inline-flex; align-items: center; gap: 4px; }
.fng-legend span.on { color: var(--ink); }        /* 目前所在區間 */
.fng-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.gauge-scale {
  max-width: 380px; margin: -2px auto 0;
  display: flex; justify-content: space-between;
  font-size: 10.5px; color: var(--ink-3); font-weight: 600;
}
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
/* 注意：class 名為 .kpi（原本叫 .stat，會與「思考中」的 .thinking .stat 撞名，
   導致思考狀態列意外套上卡片外框） */
.kpi {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 9px 12px;
}
.kpi .k { font-size: 10.5px; color: var(--ink-3); font-weight: 600; }
.kpi .n { font-size: 15px; font-weight: 800; margin-top: 2px; }
.note {
  margin-top: 13px; padding: 10px 13px; font-size: 12px;
  background: var(--accent-bg); border: 1px solid var(--accent-line);
  border-radius: 9px; color: var(--ink-2); line-height: 1.6;
}
.note b { color: var(--accent-2); }

/* 交易核准卡片 */
.approval-card {
  width: min(100%, 620px); align-self: flex-start;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border-2); border-radius: 12px; overflow: hidden;
  animation: rise .32s cubic-bezier(.2, .7, .3, 1);
}
.approval-card.done-yes { border-color: color-mix(in srgb, var(--up) 50%, transparent); }
.approval-card.done-no  { border-color: var(--border); opacity: .8; }
.ap-h {
  display: flex; align-items: center; gap: 9px;
  padding: 11px 14px; background: var(--warn-bg);
  border-bottom: 1px solid var(--border);
}
.ap-badge { font-size: 11px; font-weight: 800; color: var(--on-warn); background: var(--warn); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.ap-side { font-weight: 800; font-size: 13.5px; }
.ap-mode { margin-left: auto; font-size: 11px; color: var(--ink-2); border: 1px solid var(--border-2); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.ap-mode.live { color: var(--down); border-color: var(--down-line); }
.ap-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
.ap-row { display: flex; justify-content: space-between; font-size: 12.5px; }
.ap-row .l { color: var(--ink-3); }
.ap-row .v { font-weight: 700; }
.ap-hash { margin-top: 3px; font-family: var(--mono); font-size: 10px; color: var(--ink-3); border-top: 1px dashed var(--border-2); padding-top: 7px; }
.ap-actions { display: flex; gap: 8px; padding: 11px 14px; border-top: 1px solid var(--border); background: var(--surface); }
.ap-actions .btn-yes { flex: 1; border: none; border-radius: 9px; padding: 9px 14px; font-size: 12.5px; font-weight: 800; background: var(--up); color: var(--on-up); }
.ap-actions .btn-yes:hover { background: color-mix(in srgb, var(--up) 82%, #fff); }
.ap-actions .btn-yes:disabled, .ap-actions .btn-no:disabled { opacity: .5; cursor: not-allowed; }
.ap-actions .btn-no { border: 1px solid var(--border-2); border-radius: 9px; padding: 9px 14px; font-size: 12.5px; font-weight: 700; background: transparent; color: var(--ink-2); }
.ap-actions .btn-no:hover { color: var(--ink); border-color: var(--ink-3); }
.ap-countdown { margin-left: auto; align-self: center; font-size: 11.5px; font-weight: 800; color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.ap-countdown.low { color: var(--warn); }
.ap-countdown.expired { color: var(--down); }
.persona-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
  color: var(--ink-2); background: var(--surface); border: 1px solid var(--border-2);
  padding: 2px 9px 2px 3px; border-radius: 999px; }
/* 人格符號的統一底板 —— 全站唯一保留 emoji 的地方（它們要有個性，線圖畫不出
   鯨魚/大師的角色感）。用固定尺寸的圓形容器把它們收編進圖示系統的語彙：
   同樣的邊框色、同樣的視覺份量，只是內容物是 emoji 而非 SVG。
   字級刻意小於容器：emoji 的字面框小於實際圖形，等寬設定會讓 🐋 溢出、🎯 偏小。 */
.persona-ava {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; flex: none; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 11px; line-height: 1; font-family: var(--font);
  /* 讓不同 emoji 的光學重量一致：偏大的字元自動縮到容器內 */
  overflow: hidden;
}
.persona-ava.sm { width: 16px; height: 16px; font-size: 9px; }

/* ---- 新工具自動視覺卡（黃金 / 情緒 / 名人訊號），沿用 MAIA 色系 ---- */
.viz { padding: 2px 1px; }
.viz .hl { font-size: 12.5px; color: var(--ink-2); margin-bottom: 10px; line-height: 1.55; }
.viz-tiles { display: flex; gap: 8px; flex-wrap: wrap; }
.viz-tile { flex: 1; min-width: 92px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px; }
.viz-tile .k { display: block; font-size: 10px; color: var(--ink-3); font-weight: 700; letter-spacing: .03em; }
.viz-tile .v { display: block; font-size: 16px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
.viz-tile .chg { font-size: 11px; font-weight: 700; }
/* 沒有漲跌語意的副標（例如「Extreme Fear」「多頭佔優」）要壓下去，
   否則它會跟主數值一樣亮，磚內看不出主從 */
.viz-tile .chg:not(.up):not(.down) { color: var(--ink-3); font-weight: 600; }
.viz-tile .chg.up, .viz .up { color: var(--up); } .viz-tile .chg.down, .viz .down { color: var(--down); }
.viz-sec { font-size: 10px; font-weight: 800; color: var(--ink-3); letter-spacing: .06em; margin: 13px 0 7px; display: flex; align-items: center; gap: 8px; }
.viz-read { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
.viz-read.tail { color: var(--on-up); background: var(--up); } .viz-read.head { color: var(--on-down); background: var(--down); } .viz-read.mix { color: var(--on-warn); background: var(--warn); }
.driver { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 12px; }
.driver:last-child { border-bottom: none; }
.driver .dn { color: var(--ink-2); } .driver .dv { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 700; }
.driver .imp { font-size: 9.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; margin-left: 8px; white-space: nowrap; }
.driver .imp.tail { color: var(--up); border: 1px solid var(--up-line); } .driver .imp.head { color: var(--down); border: 1px solid var(--down-line); } .driver .imp.neu { color: var(--ink-3); border: 1px solid var(--border-2); }
.dist { height: 22px; border-radius: 7px; overflow: hidden; display: flex; border: 1px solid var(--border); }
.dist .seg { height: 100%; transition: width .3s; } .dist .seg.bear { background: var(--down); } .dist .seg.neu { background: var(--border-2); } .dist .seg.bull { background: var(--up); }
.dist-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
/* 圖例色點：取代 🔴🟢 emoji（emoji 在暗色面上偏亮、跨平台不一致，且與色盤打架） */
.dist-legend span { display: inline-flex; align-items: center; gap: 6px; }
.dist-legend i { width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0; }
.dist-legend i.bull { background: var(--up); } .dist-legend i.bear { background: var(--down); } .dist-legend i.neu { background: var(--border-2); }
.corr { position: relative; height: 9px; border-radius: 6px; margin: 8px 0 4px; background: linear-gradient(90deg, var(--down), var(--border-2) 50%, var(--up)); }
.corr .mark { position: absolute; top: -4px; width: 3px; height: 17px; background: var(--ink); border-radius: 2px; transform: translateX(-50%); box-shadow: 0 0 0 2px var(--panel, rgba(0,0,0,.3)); }
.corr-labels { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sig { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-2); margin: 3px 5px 3px 0; color: var(--ink-2); }
.sig.bullish { color: var(--up); border-color: var(--up-line); } .sig.bearish { color: var(--down); border-color: var(--down-line); }
.viz .note-inline { font-size: 11px; color: var(--warn); margin-top: 8px; line-height: 1.5; }
/* 訂單簿深度階梯 —— 收窄：卡片滿版 978px 時，價格在最左、數量在最右，
   兩者相距近一千像素，眼睛要橫掃整行才對得上，反而更難讀 */
.ob { display: flex; flex-direction: column; max-width: 580px; }
.ob-side { display: flex; flex-direction: column; gap: 1px; }
.ob-row { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 3px 9px; font-size: 11.5px; border-radius: 4px; overflow: hidden; }
.ob-row .ob-bar { position: absolute; right: 0; top: 0; bottom: 0; opacity: .16; }
.ob-row.ask .ob-bar { background: var(--down); } .ob-row.bid .ob-bar { background: var(--up); }
.ob-row .ob-p { position: relative; font-weight: 700; font-variant-numeric: tabular-nums; }
.ob-row.ask .ob-p { color: var(--down); } .ob-row.bid .ob-p { color: var(--up); }
.ob-row .ob-v { position: relative; color: var(--ink-2); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.ob-spread { display: flex; justify-content: space-between; padding: 5px 9px; font-size: 10.5px; color: var(--ink-3); font-weight: 700; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); margin: 3px 0; }
/* 掛單表 */
.ord-table { display: flex; flex-direction: column; }
.ord-row { display: grid; grid-template-columns: 40px 1fr auto auto auto; gap: 10px; align-items: center; padding: 6px 3px; font-size: 11.5px; border-bottom: 1px dashed var(--border); }
.ord-row:last-child { border-bottom: none; }
.ord-row.head { color: var(--ink-3); font-weight: 800; font-size: 10px; letter-spacing: .03em; }
/* 爆倉熱力圖：價位橫條 */
.heat { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.heat-row { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 3px 9px; font-size: 11px; border-radius: 4px; overflow: hidden; }
.heat-row .heat-bar { position: absolute; left: 0; top: 0; bottom: 0; opacity: .18; }
.heat-row .heat-bar.long { background: var(--up); } .heat-row .heat-bar.short { background: var(--down); }
.heat-row .heat-p { position: relative; font-weight: 700; font-variant-numeric: tabular-nums; }
.heat-row.long .heat-p { color: var(--up); } .heat-row.short .heat-p { color: var(--down); }
.heat-row .heat-v { position: relative; color: var(--ink-2); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.heat-cur { text-align: center; font-size: 10.5px; color: var(--accent); font-weight: 800; padding: 4px 0; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); margin: 3px 0; }
/* 分析師簡報 */
.desk-verdict { display: flex; align-items: center; gap: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; }
.dv-bias { font-size: 22px; font-weight: 900; padding: 6px 16px; border-radius: 10px; background: var(--surface-2); color: var(--ink); }
.dv-bias.up { color: var(--up); } .dv-bias.down { color: var(--down); }
.dv-meta { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--ink-2); }
.dv-meta b { color: var(--ink); }
.desk-layer { padding: 7px 0; border-bottom: 1px dashed var(--border); }
.desk-layer:last-child { border-bottom: none; }
.dl-head { display: flex; justify-content: space-between; align-items: center; }
.dl-name { font-size: 12.5px; font-weight: 700; color: var(--ink); }
.dl-sig { font-size: 11.5px; font-weight: 800; color: var(--ink-3); }
.dl-sig.up { color: var(--up); } .dl-sig.down { color: var(--down); }
.dl-bar { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 5px 0 4px; }
.dl-fill { display: block; height: 100%; background: var(--border-2); }
.dl-fill.up { background: var(--up); } .dl-fill.down { background: var(--down); }
.dl-ev { font-size: 11px; color: var(--ink-3); line-height: 1.5; }
.desk-memo { margin-top: 11px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.dm-row { display: flex; gap: 9px; font-size: 11.5px; color: var(--ink-2); line-height: 1.55; padding: 2px 0; }
.dm-row .dm-k { flex: 0 0 42px; font-weight: 800; color: var(--accent); }
/* ---- 回測嚴謹度視覺：顯著性徽章 / 信賴區間 / 組合模式 / 統計註腳 ---- */
.verdict-badge {
  font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 6px;
  letter-spacing: .02em; white-space: nowrap; vertical-align: 1px;
}
.verdict-badge.strong { color: var(--on-up); background: var(--up); }
.verdict-badge.none   { color: var(--on-warn); background: var(--warn); }
.verdict-badge.weak   { color: var(--ink-3); border: 1px solid var(--border-2); }
/* 信賴區間橫條：中線 = 0；區間跨過 0 代表效果方向不確定 */
.ci { position: relative; height: 26px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.ci-zero { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-2); }
.ci-range { position: absolute; top: 7px; height: 12px; border-radius: 6px; opacity: .38; }
.ci-range.up { background: var(--up); } .ci-range.down { background: var(--down); }
.ci-point { position: absolute; top: 4px; width: 3px; height: 18px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); }
.ci-labels { display: flex; justify-content: space-between; margin-top: 5px; font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
/* 組合回測模式列 */
.combo-mode { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 12px; border-radius: 10px; margin-bottom: 13px; border: 1px solid var(--border); background: var(--surface); }
.combo-mode .cm-tag { font-family: var(--mono); font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 6px; }
.combo-mode.and .cm-tag { color: var(--on-up); background: var(--up); }
.combo-mode.or  .cm-tag { color: #fff; background: var(--accent); }
.combo-mode .cm-desc { font-size: 11.5px; color: var(--ink-2); flex: 1; min-width: 180px; }
.combo-mode .cm-win { font-size: 10.5px; color: var(--ink-3); font-family: var(--mono); border: 1px solid var(--border-2); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
/* 漏斗最後一列（共振結果）用 accent 標示，與上方單一訊號區隔 */
.heat-row.combo { margin-top: 3px; border-top: 1px dashed var(--border); padding-top: 5px; }
.heat-row.combo .heat-bar.combo { background: var(--accent); opacity: .26; }
.heat-row.combo .heat-p { color: var(--accent-2); font-weight: 800; }
.stat-foot { font-size: 11px; color: var(--ink-3); margin-top: 9px; line-height: 1.6; font-variant-numeric: tabular-nums; }
/* run_id 是「可重現性」的憑證，屬於資訊 → 必須用 ink-3（ink-4 只有 4.17:1，不過 AA） */
.run-id { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 5px; }

/* 分析沙盒輸出 */
.sbx-out { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); line-height: 1.55; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin-top: 5px; max-height: 320px; overflow-y: auto; }
.ord-row .r { text-align: right; font-variant-numeric: tabular-nums; } .ord-row .r.num { color: var(--ink); }
/* 使用者總覽儀表板 */
.dash { padding: 12px 13px; overflow-y: auto; height: 100%; }
.dash-sec { font-size: 10px; font-weight: 800; color: var(--ink-3); letter-spacing: .06em; margin: 15px 0 8px; }
.dash-sec:first-child { margin-top: 2px; }
.dash-tiles { display: flex; gap: 8px; flex-wrap: wrap; }
.dash-tile { flex: 1; min-width: 112px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
.dash-tile .k { display: block; font-size: 10px; color: var(--ink-3); font-weight: 700; }
.dash-tile .v { display: block; font-size: 14px; font-weight: 800; color: var(--ink); margin-top: 3px; }
.dash-bal { display: flex; flex-direction: column; }
.bal-row { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 2px; border-bottom: 1px dashed var(--border); font-size: 12px; }
.bal-row:last-child { border-bottom: none; }
.bal-row .c { font-weight: 800; color: var(--ink-2); } .bal-row .num { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; } .bal-row .lk { font-size: 10px; color: var(--ink-3); text-align: right; }
.dash-mkts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.mkt-chip { font-size: 11px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; }
.mkt-chip b { color: var(--accent-2); }
.mkt-chip b.up { color: var(--up); } .mkt-chip b.down { color: var(--down); }
.stk-tag { font-size: 10px; color: var(--accent-2); border: 1px solid var(--accent-2); border-radius: 999px; padding: 1px 7px; opacity: .9; white-space: nowrap; }
.act-list { display: flex; flex-direction: column; }
.act-row { display: flex; gap: 8px; align-items: baseline; padding: 5px 2px; border-bottom: 1px dashed var(--border); font-size: 11.5px; color: var(--ink); }
.act-row:last-child { border-bottom: none; }
.act-row .act-t { color: var(--ink-2); white-space: nowrap; }
.act-row .act-c { font-weight: 800; color: var(--ink-2); white-space: nowrap; }
.act-row .act-a { font-variant-numeric: tabular-nums; }
.act-row .act-d { color: var(--ink-3); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act-row .act-time { margin-left: auto; color: var(--ink-3); font-size: 10px; white-space: nowrap; }
.act-row .act-conv { color: var(--ink); }
.act-row .act-net { color: var(--accent-2); font-size: 10px; white-space: nowrap; }
.act-row .act-addr { flex: 1; font-family: ui-monospace, monospace; font-size: 10.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act-int { color: var(--accent-2); font-size: 9px; border: 1px solid var(--border); border-radius: 6px; padding: 0 4px; }
.dsrc-sum { font-size: 11.5px; color: var(--ink-2); padding: 4px 2px 8px; line-height: 1.5; }
.act-row .risk-hi { color: var(--warn); font-weight: 700; }   /* 警示琥珀色（不隨漲跌配色翻轉）*/
.act-row .risk-lo { color: var(--accent-2); }
/* 帳戶面板：從 4 個橫向分頁改成左選單 + 右內容。
   橫向分頁放不下 8 個分類，而把 8 類硬塞進 4 個分頁正是「藏太深」的成因 ——
   對帳差異、批次組成、入金來源都要點兩三層才看得到。左選單能容納更多分類，
   每一類進去就是平鋪的內容，不必再往下鑽。 */
/* 用容器查詢而非媒體查詢：這個面板同時出現在 modal（~590px）與側欄（236px），
   而側欄再窄，視窗仍是 1400px —— @media 看的是視窗，永遠不會觸發。
   容器查詢問的是「我這個容器多寬」，才是這裡真正的條件。 */
/* 容器必須宣告在**外層**：@container 只能設定後代，無法設定被查詢的容器本身 ——
   把 container-type 放在 .acct-layout 上，grid-template-columns 就永遠不會被覆寫。 */
.dash { container-type: inline-size; container-name: acct; }
.acct-layout { display: grid; grid-template-columns: 132px 1fr; gap: 0; min-height: 420px; }
.acct-nav {
  display: flex; flex-direction: column; gap: 1px; padding-right: 10px;
  border-right: 1px solid var(--border); position: sticky; top: 0; align-self: start;
}
.acct-nav .an {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: none; border: none; border-radius: var(--r-sm);
  color: var(--ink-3); font: inherit; font-size: 12.5px; font-weight: 600;
  padding: 8px 9px; cursor: pointer; text-align: left;
  transition: background .14s, color .14s;
}
.acct-nav .an:hover { color: var(--ink-2); background: var(--surface-2); }
.acct-nav .an.active { color: var(--accent-2); background: var(--surface-2); }
.acct-nav .an svg { flex: none; opacity: .9; }
.acct-body { padding-left: 16px; min-width: 0; }
/* 讀數列在面板內容寬度下要能三格並排；.dk 的 168px 下限是給對話區設計的，
   放進面板會擠成 2+1（第三格獨佔一列，看起來像壞掉）。 */
.acct-body .desk-strip .dk { min-width: 104px; }
.acct-body .desk-strip .dk .dk-v { font-size: 19px; }
.acct-body > .sec { display: none; }
.acct-body > .sec.on { display: block; }
/* 容器窄於 420px（側欄、手機 modal）→ 左選單改成頂部橫向捲動，只留圖示，
   否則內容區只剩 90px 什麼都放不下。 */
@container acct (max-width: 420px) {
  .acct-layout { grid-template-columns: 1fr; }
  .acct-nav { flex-direction: row; overflow-x: auto; border-right: none;
    border-bottom: 1px solid var(--border); padding: 0 0 8px; margin-bottom: 12px; position: static; }
  .acct-nav .an { width: auto; white-space: nowrap; padding: 7px 10px; }
  .acct-nav .an span { display: none; }
  .acct-body { padding-left: 0; }
}
/* 容器查詢不可用時的保底（舊瀏覽器）：用視窗寬度處理手機情境 */
@supports not (container-type: inline-size) {
  @media (max-width: 620px) { .acct-layout { grid-template-columns: 1fr; }
    .acct-nav { flex-direction: row; overflow-x: auto; border-right: none;
      border-bottom: 1px solid var(--border); padding: 0 0 8px; margin-bottom: 12px; position: static; }
    .acct-nav .an { width: auto; white-space: nowrap; }
    .acct-nav .an span { display: none; }
    .acct-body { padding-left: 0; } }
}
.dtabs { display: flex; gap: 4px; margin: -2px 0 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.dtabs .dt { flex: 1; background: none; border: none; border-bottom: 2px solid transparent; color: var(--ink-3); font-size: 13px; font-weight: 700; padding: 9px 4px; cursor: pointer; transition: color .15s, border-color .15s; }
.dtabs .dt:hover { color: var(--ink-2); }
.dtabs .dt.active { color: var(--accent-2); border-bottom-color: var(--accent-2); }
.dtab-panel.hidden { display: none; }
.pnl-btn { width: 100%; background: var(--accent); color: var(--on-accent); border: none; border-radius: var(--r-sm); padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 12px; transition: filter .15s; }
.pnl-btn:hover { filter: brightness(1.1); }
/* ── 艙位成本與損益（P4）──────────────────────────────
   顏色一律用 .up/.down（跟隨使用者的紅漲/綠漲設定），不可寫死。 */
.pnl-hero { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.pnl-hero .ph { flex: 1; min-width: 140px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; }
.pnl-hero .ph .k { display: block; font-size: 10px; color: var(--ink-3); font-weight: 700; letter-spacing: .04em; }
.pnl-hero .ph .big { display: block; font-size: 24px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.pnl-hero .ph .sub { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
/* 對帳可信度徽章：損益數字旁邊一定要看得到資料可不可信 */
.rec-chip { width: 100%; text-align: left; display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px; margin-top: 9px; font-size: 11.5px; color: var(--ink-2); cursor: pointer; transition: border-color .15s; }
.rec-chip:hover { border-color: var(--accent-2); }
.rec-chip .rc-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.rec-chip .rc-arrow { margin-left: auto; color: var(--ink-3); font-size: 10px; }
.rec-body { display: none; padding: 4px 2px 2px; }
.rec-body.open { display: block; }
.rec-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: baseline; padding: 6px 2px; border-bottom: 1px dashed var(--border); font-size: 11px; }
.rec-row:last-child { border-bottom: none; }
.rec-row .rc { font-weight: 800; color: var(--ink-2); }
.rec-row .rd { color: var(--ink-3); font-size: 10px; line-height: 1.45; }
.rec-row .rg { text-align: right; font-variant-numeric: tabular-nums; color: var(--warn); }   /* 差異是資料缺口，不是損益 → 不用漲跌色 */
/* 艙位卡：整列可點開看批次組成 */
.pos-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
.pos-head { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; padding: 11px 13px; cursor: pointer; align-items: center; }
.pos-head:hover { background: var(--surface-2, rgba(255,255,255,.02)); }
.pos-head .pc { font-size: 14px; font-weight: 800; color: var(--ink); }
.pos-head .pq { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
.pos-head .pp { text-align: right; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pos-head .ppp { text-align: right; font-size: 10.5px; color: var(--ink-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
.pos-body { display: none; padding: 2px 13px 12px; border-top: 1px dashed var(--border); }
.pos-body.open { display: block; }
.lot-row { display: grid; grid-template-columns: 62px 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 11px; }
.lot-row:last-child { border-bottom: none; }
.lot-row .lt { color: var(--ink-2); font-weight: 700; font-variant-numeric: tabular-nums; }
.lot-row .ld { color: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
.lot-row .lp { text-align: right; font-variant-numeric: tabular-nums; }
.pos-note { font-size: 10px; color: var(--ink-3); line-height: 1.5; margin-top: 8px; }
.basis-tag { font-size: 9.5px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 6px; color: var(--ink-3); white-space: nowrap; }
.basis-tag.warn { color: var(--warn); border-color: var(--warn); }   /* 警示琥珀（不隨漲跌翻轉）*/
/* 成本配對法切換 */
.mth-tog { display: flex; gap: 4px; align-items: center; margin-bottom: 9px; }
.mth-tog .mt { background: var(--surface); border: 1px solid var(--border); color: var(--ink-3); border-radius: 999px; padding: 4px 11px; font-size: 11px; font-weight: 700; cursor: pointer; transition: all .15s; }
.mth-tog .mt.active { color: #fff; background: var(--accent); border-color: var(--accent); }
.mth-tog .mt-hint { font-size: 10px; color: var(--ink-3); margin-left: auto; }
.pnl-ov { position: fixed; inset: 0; background: rgba(4, 8, 16, .66); display: none; place-items: center; z-index: 200; padding: 20px; }
.pnl-ov.open { display: grid; }
.pnl-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; max-width: 520px; width: 100%; }
.pnl-box #pnl-svg svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.pnl-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }
.pnl-actions button, .pnl-actions a { background: var(--accent-2); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; }
.pnl-actions .ghost { background: transparent; border: 1px solid var(--border); color: var(--ink-2); }
.dash-traits { display: flex; flex-direction: column; gap: 6px; }
.trait { font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; line-height: 1.4; }
/* 五維驗證儀表 */
.fd-verdict {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 13px; margin-bottom: 11px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--border-2); border-radius: 10px;
}
.fd-verdict.bull { border-left-color: var(--up); }
.fd-verdict.bear { border-left-color: var(--down); }
.fd-verdict.mixed { border-left-color: var(--warn); }
.fd-verdict .fdv-tag { font-size: 14px; font-weight: 800; }
.fd-verdict.bull .fdv-tag { color: var(--up); }
.fd-verdict.bear .fdv-tag { color: var(--down); }
.fd-verdict.mixed .fdv-tag { color: var(--warn); }
.fd-verdict .fdv-count { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fd-verdict .fdv-cov { margin-left: auto; font-size: 10.5px; color: var(--ink-3); font-family: var(--mono); white-space: nowrap; }
.fivedim { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.fd-tile { background: var(--surface); border: 1px solid var(--border); border-top: 2px solid var(--border-2); border-radius: 9px; padding: 9px 6px; text-align: center; }
.fd-tile.bull { border-top-color: var(--up); } .fd-tile.bear { border-top-color: var(--down); } .fd-tile.neutral { border-top-color: var(--warn); } .fd-tile.empty { opacity: .45; }
.fd-tile .fd-l { display: block; font-size: 10px; color: var(--ink-3); font-weight: 800; }
.fd-tile .fd-v { display: block; font-size: 12px; font-weight: 800; margin-top: 4px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fd-tile.bull .fd-v { color: var(--up); } .fd-tile.bear .fd-v { color: var(--down); }
.ap-result { padding: 10px 14px; font-size: 12.5px; border-top: 1px solid var(--border); }

/* Reader 安全層警示 */
.reader-alert {
  width: min(96%, 620px); align-self: flex-start;
  background: var(--warn-bg); border: 1px solid var(--warn-line);
  border-radius: 10px; padding: 10px 13px; font-size: 12px; color: var(--ink-2);
  animation: rise .32s cubic-bezier(.2, .7, .3, 1);
}
.reader-alert b { color: var(--warn); }
.reader-alert code { font-family: var(--mono); font-size: 11px; background: var(--surface-3); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; color: var(--ink); }

/* ---------------- Composer ---------------- */
.composer { border-top: 1px solid var(--border); padding: 11px 14px 16px; display: flex; flex-direction: column; align-items: center; gap: 9px; flex-shrink: 0; }
.suggest { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; width: 100%; max-width: 768px; }
.suggest::-webkit-scrollbar { display: none; }
.qp-label { font-size: 11px; color: var(--ink-3); font-weight: 700; align-self: center; white-space: nowrap; }
.chip {
  font-size: 11.5px; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 5px 11px; border-radius: 999px; white-space: nowrap;
  transition: border-color .15s, color .15s;
}
.chip:hover { border-color: var(--accent-dim); color: var(--ink); }
.inbar {
  display: flex; align-items: flex-end; gap: 9px;
  width: 100%; max-width: 768px;
  background: var(--surface-2); border: 1px solid var(--border-2);
  border-radius: 16px; padding: 8px 8px 8px 15px;
  box-shadow: var(--shadow);
  transition: border-color .16s ease, box-shadow .16s ease;
}
.inbar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.inbar textarea {
  flex: 1; background: transparent; border: none; resize: none;
  color: var(--ink); font-family: inherit; font-size: 13.5px; line-height: 1.5;
  outline: none; max-height: 120px; padding: 6px 0;
}
.inbar textarea::placeholder { color: var(--ink-3); }
.send {
  width: 34px; height: 34px; border-radius: 9px; border: none;
  background: var(--max-blue); color: #fff; font-size: 15px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: background .15s;
}
.send:hover { background: var(--accent); }
.send:disabled { background: var(--surface-3); color: var(--ink-3); cursor: not-allowed; }
.stop {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  background: var(--down-bg); border: 1px solid var(--down-line);
  color: var(--down); font-size: 11px; display: none;
  align-items: center; justify-content: center;
}
.stop.on { display: flex; }

/* ---------------- Dock ---------------- */
/* ---------------- 左側對話歷史側欄 (History sidebar) ---------------- */
.histbar {
  width: 236px; flex-shrink: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  display: flex; flex-direction: column; overflow: hidden;
}
.histbar.hidden { display: none; }
/* ── 側欄分頁（F）：對話／帳戶 ── */
.sb-tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.sb-tab { flex: 1; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--ink-3); font: inherit; font-size: 12.5px; font-weight: 700; padding: 10px 4px;
  cursor: pointer; transition: color .15s, border-color .15s; }
.sb-tab:hover { color: var(--ink-2); }
.sb-tab.active { color: var(--accent-2); border-bottom-color: var(--accent-2); }
.sb-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.sb-pane.hidden { display: none; }
.sb-pane[data-sb="acct"] { overflow-y: auto; }
.sb-pane[data-sb="acct"] .dash { padding: 10px; }
/* 側欄較窄：帳戶內容的多欄格線收成單欄，數字才不會被擠爆 */
.sb-pane[data-sb="acct"] .dash-tiles, .sb-pane[data-sb="acct"] .pnl-hero,
.sb-pane[data-sb="acct"] .desk-strip { flex-direction: column; }
.sb-pane[data-sb="acct"] .dash-donut-wrap { flex-direction: column; align-items: flex-start; gap: 10px; }
/* 側欄只有 236px，是 modal 的 45%。以下把為寬版設計的元件改成窄欄可讀的堆疊式，
   否則「均成本」會被拆到兩行、質押數值會被裁掉。 */
.sb-pane[data-sb="acct"] .pos-head { grid-template-columns: 1fr; gap: 6px; }
.sb-pane[data-sb="acct"] .pos-head .pp,
.sb-pane[data-sb="acct"] .pos-head .ppp { text-align: left; }
.sb-pane[data-sb="acct"] .pos-head .pq { font-size: 10px; line-height: 1.5; }
/* 用換行分隔取代「·」串接：窄欄下串接會在任意位置斷開（「均成/本」） */
.sb-pane[data-sb="acct"] .pq .sep { display: block; }
/* 分隔點只在同一行串接時有意義；堆疊成多行後要收起來，否則每行開頭都掛一個「·」 */
.sb-pane[data-sb="acct"] .pq .dot { display: none; }
.pq .dot { font-style: normal; margin: 0 5px; color: var(--ink-4); }
.sb-pane[data-sb="acct"] .lot-row { grid-template-columns: 52px 1fr; row-gap: 2px; }
.sb-pane[data-sb="acct"] .lot-row .lp { grid-column: 2; text-align: right; }
/* 餘額列：三欄在 236px 下必定溢出 → 質押/鎖定改成第二行 */
.sb-pane[data-sb="acct"] .bal-row { grid-template-columns: 1fr auto; row-gap: 1px; }
.sb-pane[data-sb="acct"] .bal-row .lk { grid-column: 1 / -1; text-align: left; }
.sb-pane[data-sb="acct"] .dash-bal, .sb-pane[data-sb="acct"] .dtab-panel { overflow-x: hidden; }
.sb-pane[data-sb="acct"] .prov-row, .sb-pane[data-sb="acct"] .desk-strip { flex-wrap: wrap; }
.hb-top { padding: 12px; display: flex; flex-direction: column; gap: 9px; flex-shrink: 0; }
.hb-new { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 12px;
  border: 1px solid var(--border-2); border-radius: 10px; background: transparent; color: var(--ink);
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.hb-new:hover { border-color: var(--accent); color: var(--accent); }
.hb-search { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 9px;
  background: var(--bg); color: var(--ink); font: inherit; font-size: 12.5px; }
.hb-list { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 8px 12px; }
.hb-group { color: var(--ink-3); font-size: 10.5px; font-weight: 700; letter-spacing: .5px;
  text-transform: uppercase; margin: 12px 8px 4px; }
.hb-item { padding: 8px 10px; border-radius: 8px; font-size: 12.5px; color: var(--ink-2); cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-item:hover { background: var(--bg); color: var(--ink); }
.hb-item.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.hb-empty { color: var(--ink-3); font-size: 12px; padding: 16px 10px; text-align: center; line-height: 1.55; }
.hb-foot { border-top: 1px solid var(--border); padding: 9px 12px; display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.hb-user { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.hb-ava { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--border); color: var(--ink-2); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.hb-who { font-size: 12.5px; color: var(--ink); line-height: 1.2; overflow: hidden; white-space: nowrap; }
.hb-who small { display: block; color: var(--ink-3); font-size: 10.5px; }
.hb-theme { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--surface); color: var(--ink-2); font-size: 14px; display: grid; place-items: center; flex-shrink: 0; transition: border-color .15s, color .15s; }
.hb-theme:hover { border-color: var(--accent); color: var(--accent); }

.dock {
  /* 360px 固定寬在 1400px 螢幕上吃掉 26%，但內容常常只有幾行日誌 ——
     改成可拖曳調整，寬度記在 localStorage；預設收斂到 300px。 */
  width: var(--dock-w, 300px); flex-shrink: 0; position: relative;
  min-width: 240px; max-width: 560px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  display: flex; flex-direction: column; overflow: hidden;
}
/* 拖曳把手：貼在 dock 左緣，只有 hover 才顯形，不干擾閱讀 */
.dock-grip {
  position: absolute; left: -1px; top: 0; bottom: 0; width: 6px; cursor: col-resize;
  z-index: 5; background: transparent; transition: background .15s;
}
.dock-grip:hover, .dock-grip.dragging { background: var(--accent); }
body.dock-resizing { cursor: col-resize; user-select: none; }
.dock.hidden { display: none; }
.dock-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.dock-tab {
  flex: 1; background: transparent; border: none;
  padding: 11px 8px; font-size: 12px; font-weight: 700; color: var(--ink-3);
  border-bottom: 2px solid transparent;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.dock-tab:hover { color: var(--ink-2); }
.dock-tab.active { color: var(--accent-2); border-bottom-color: var(--accent); }
.dock-tab .badge {
  font-size: 10px; font-family: var(--mono); font-weight: 700;
  background: var(--surface-3); color: var(--ink-2);
  padding: 0 6px; border-radius: 999px; min-width: 18px; text-align: center;
}
/* min-width:0 + overflow-x:hidden — 沒有這兩行，執行紀錄的長字串會撐爆面板寬度並溢出右緣 */
.dock-body { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px; display: none; }
.dock-body.active { display: block; }
/* 訂單簿分頁 */
.bk-market { width: 100%; margin-bottom: 8px; padding: 6px 9px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--ink); font: inherit; font-size: 12.5px; }
.bk-row { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 2.5px 8px; font-size: 11px; font-family: var(--mono); font-variant-numeric: tabular-nums; overflow: hidden; }
.bk-bar { position: absolute; top: 1px; bottom: 1px; right: 0; opacity: .16; border-radius: 2px; }
.bk-row.ask .bk-bar { background: var(--down); } .bk-row.bid .bk-bar { background: var(--up); }
.bk-row.ask .bk-p { color: var(--down); } .bk-row.bid .bk-p { color: var(--up); }
.bk-row .bk-p, .bk-row .bk-v { position: relative; z-index: 1; }
.bk-row .bk-v { color: var(--ink-3); }
.bk-spread { text-align: center; font-size: 10.5px; color: var(--ink-3); padding: 5px 0; border-block: 1px solid var(--border); margin: 3px 0; font-family: var(--mono); }

/* 執行紀錄 */
.term { font-family: var(--mono); font-size: 11px; line-height: 1.65; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tl { border-left: 2px solid var(--border); padding-left: 9px; min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
.tl .time { color: var(--ink-3); font-size: 10px; margin-right: 6px; }
.tl.status  { color: var(--accent-2); border-left-color: var(--accent-dim); }
.tl.thought { color: var(--ink-2); }
.tl.tool    { color: var(--accent-2); border-left-color: var(--accent); }
.tl.tool b  { color: var(--ink); }
.tl.result  { color: var(--up); border-left-color: color-mix(in srgb, var(--up) 50%, transparent); }
.tl.error   { color: var(--down); border-left-color: var(--down); }
.tl pre {
  margin: 5px 0 0; padding: 7px 9px; font-size: 10.5px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
  white-space: pre-wrap; word-break: break-all;
  max-height: 180px; overflow-y: auto; color: var(--ink-2);
}
.tl details summary { cursor: pointer; color: var(--ink-3); font-size: 10.5px; margin-top: 3px; }

/* 圖表索引 */
.cidx { display: flex; flex-direction: column; gap: 7px; }
.cidx-empty { color: var(--ink-3); font-size: 11.5px; text-align: center; padding: 26px 10px; }
.cidx-item {
  display: flex; align-items: center; gap: 9px; text-align: left;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 11px; width: 100%;
  color: var(--ink); transition: border-color .15s;
}
.cidx-item:hover { border-color: var(--accent-dim); }
.cidx-item .ic { font-size: 14px; }
.cidx-item .t { font-size: 12px; font-weight: 700; flex: 1; }
.cidx-item .time { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }

/* ---------------- 響應式 ---------------- */
@media (max-width: 1100px) {
  .dock { position: fixed; right: 12px; top: 58px; bottom: 12px; width: min(360px, 88vw); z-index: 50; border-left: 1px solid var(--border); }
  .dock:not(.open) { display: none; }
  .brand .tag { display: none; }
}
@media (max-width: 860px) {
  .stage { padding: 12px; gap: 12px; }
  .histbar { display: none; }           /* 窄畫面隱藏左側歷史側欄，把空間讓給對話 */
  .ticker { display: none; }            /* 頂欄空間不足時先讓跑馬燈退場，避免品牌/狀態被擠爆 */
  .cap-grid { grid-template-columns: 1fr; }
  .chart-card { padding: 13px 13px 15px; }
  .fivedim { grid-template-columns: repeat(3, 1fr); }   /* 固定 5 欄在窄畫面會擠成不可讀的細條 */
}
@media (max-width: 560px) {
  .topbar { padding: 8px 12px; gap: 10px; }
  .bubble { max-width: 92%; }
  .fivedim { grid-template-columns: repeat(2, 1fr); }
  .stat-grid { grid-template-columns: 1fr 1fr; }
}
/* 互動質感：關鍵可點元件補一致過渡 + 按下微縮回饋（reduced-motion 時由下方全域關閉） */

/* ================================================================

const $ = (id) => document.getElementById(id);
const threadEl   = $("thread");

const inputEl    = $("chat-input");
const btnSend    = $("btn-send");

let messages = [];          // 對話歷史（session 層級）
// 每個對話的唯一 id：用來把整段對話存成可重播 session（點左側歷史即可還原對話＋圖表）

let streaming = false;
let abortCtrl = null;
let termCount = 0;
let chartCount = 0;

/* ---------- 設計 token ----------
   唯一真相來源 = CSS :root 變數。舊版把色票在 JS 裡「抄」了一份，兩邊各自漂移，
   結果圖表（tooltip / 甜甜圈描邊 / 儀表軌道 / 軸標）用的是舊 navy 色票，
   周圍卡片卻是中性灰 → 接縫、色塊、對比不足。這裡直接讀 CSS 變數，不再抄。 */
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {
  accent: cssVar("--accent"), accent2: cssVar("--accent-2"), maxBlue: cssVar("--max-blue"),
  up: cssVar("--up"), down: cssVar("--down"), warn: cssVar("--warn"),
  ink: cssVar("--ink"), ink2: cssVar("--ink-2"), ink3: cssVar("--ink-3"),
  surface: cssVar("--surface"), surface2: cssVar("--surface-2"), surface3: cssVar("--surface-3"),
  border: cssVar("--border"), border2: cssVar("--border-2"),
  grid: cssVar("--grid"),
  cat: [cssVar("--c1"), cssVar("--c2"), cssVar("--c3"), cssVar("--c4"), cssVar("--c5"), cssVar("--c6")],
};
/* 卡片底色是 surface-2 → surface 的漸層；甜甜圈／儀表的描邊取中間值才不會出現接縫 */
C.cardBg = C.surface2;
const alpha = (hex, a) => hex + Math.round(a * 255).toString(16).padStart(2, "0");

/* Chart.js 全域樣式（一次設定，所有圖表繼承） */
if (window.Chart) {
  Chart.defaults.color = C.ink2;
  Chart.defaults.font.family = cssVar("--font");   // trim 過，避免前導空白讓第一個字體失效
  Chart.defaults.font.size = 11;
  Chart.defaults.borderColor = C.grid;
  Chart.defaults.plugins.tooltip.backgroundColor = C.surface3;
  Chart.defaults.plugins.tooltip.borderColor = C.border2;
  Chart.defaults.plugins.tooltip.borderWidth = 1;
  Chart.defaults.plugins.tooltip.titleColor = C.ink;
  Chart.defaults.plugins.tooltip.bodyColor = C.ink2;
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.cornerRadius = 8;
  Chart.defaults.plugins.tooltip.displayColors = false;
  Chart.defaults.plugins.tooltip.bodyFont = { family: "ui-monospace, SF Mono, monospace", size: 11.5 };
  Chart.defaults.plugins.legend.labels.boxWidth = 9;
  Chart.defaults.plugins.legend.labels.boxHeight = 9;
  Chart.defaults.plugins.legend.labels.padding = 12;
  Chart.defaults.plugins.legend.labels.color = C.ink2;
  Chart.defaults.plugins.legend.labels.usePointStyle = true;
  Chart.defaults.plugins.legend.labels.pointStyle = "rectRounded";
}

/* ---------- 小工具 ---------- */
function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text == null ? "" : String(text);
  return div.innerHTML;
}
/* 區塊級 Markdown 渲染（先 escape 再組裝 → XSS 安全，不引入外部套件）。
   支援：#~###### 標題、有序/無序清單(含縮排巢狀)、fenced code、| 表格 |、
   **粗** *斜* `碼` [文字](http…) 連結。串流逐 token 重繪也用它（半開標記由呼叫端先補齊）。 */
function mdInline(escaped) {
  // 用 split 切開行內碼片段（奇數索引為 `code`），只在非碼片段套用連結/粗斜體 → 無需佔位符、不與正文碰撞
  return String(escaped).split(/(`[^`]+`)/g).map((p, idx) => {
    if (idx % 2 === 1) return `<code>${p.slice(1, -1)}</code>`;
    return p
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\*([^*\s][^*]*?)\*/g, "<i>$1</i>");
  }).join("");
}
function _mdRow(line) { return line.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()); }
function _mdIndent(l) { const m = l.match(/^(\s*)/); return m[1].replace(/\t/g, "  ").length; }
function _mdList(lines, start) {
  const base = _mdIndent(lines[start]);
  const ordered = /^\s*\d+\.\s/.test(lines[start]);
  let i = start, html = ordered ? "<ol class='md-ol'>" : "<ul class='md-ul'>";
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*$/.test(l) || !/^\s*([-*•]|\d+\.)\s+/.test(l)) break;
    const ind = _mdIndent(l);
    if (ind < base) break;
    if (ind > base) { const sub = _mdList(lines, i); html = html.replace(/<\/li>\s*$/, sub.html + "</li>"); i = sub.next; continue; }
    html += `<li>${mdInline(escapeHtml(l.replace(/^\s*([-*•]|\d+\.)\s+/, "")))}</li>`;
    i++;
  }
  return { html: html + (ordered ? "</ol>" : "</ul>"), next: i };
}
function formatMarkdown(text) {
  const lines = String(text == null ? "" : text).split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {                     // fenced code
      const code = []; i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
      i++;
      out.push(`<pre class="md-pre"><code>${escapeHtml(code.join("\n"))}</code></pre>`);
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length &&    // 表格：本行 |..| + 下一行分隔列 |---|
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
      const header = _mdRow(line); i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(_mdRow(lines[i])); i++; }
      let t = `<table class="md-table"><thead><tr>` +
        header.map((c) => `<th>${mdInline(escapeHtml(c))}</th>`).join("") + `</tr></thead><tbody>`;
      for (const r of rows) t += `<tr>` + r.map((c) => `<td>${mdInline(escapeHtml(c))}</td>`).join("") + `</tr>`;
      out.push(t + `</tbody></table>`);
      continue;
    }
    const h = line.match(/^\s*(#{1,6})\s+(.*)$/);   // 標題
    if (h) { out.push(`<div class="md-h">${mdInline(escapeHtml(h[2]))}</div>`); i++; continue; }
    if (/^\s*([-*•]|\d+\.)\s+/.test(line)) { const r = _mdList(lines, i); out.push(r.html); i = r.next; continue; }
    if (/^\s*$/.test(line)) { i++; continue; }
    const para = [];                                 // 段落
    while (i < lines.length && !/^\s*$/.test(lines[i]) &&
           !/^\s*(#{1,6}\s|```|[-*•]\s|\d+\.\s)/.test(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i])) {
      para.push(mdInline(escapeHtml(lines[i]))); i++;
    }
    if (para.length) out.push(`<p class="md-p">${para.join("<br>")}</p>`);
  }
  return out.join("");
}
/* 串流中補齊未閉合的 markdown 標記，避免半開的 ```/`/** 在逐 token 重繪時破壞版面 */
function closeOpenMarkdown(s) {
  let t = String(s == null ? "" : s);

  if (((t.match(/`/g) || []).length) % 2 === 1) t += "`";          // 未閉合行內碼

const _tkPrev = {};   // 各市場上次價格 → 供跑馬燈「較上次變動」閃爍比對
async function refreshTicker() {
  try {
    const data = await (await fetch("/api/tickers")).json();
    if (!data.tickers || !data.tickers.length) return;
    const track = $("ticker").querySelector(".ticker-track");
    if (!track) {
      // 首次：建立『雙份』軌道達成無縫捲動；記下基準價
      const set = data.tickers.map(tkHtml).join("");
      $("ticker").innerHTML = `<div class="ticker-track">${set}${set}</div>`;
      data.tickers.forEach((t) => { _tkPrev[t.market] = t.last; });
    } else {
      // 後續：就地更新價格/漲跌，保留捲動動畫不重啟（避免每 10 秒跳動）
      data.tickers.forEach((t) => {
        const prev = _tkPrev[t.market];
        const dir = (prev != null && t.last !== prev) ? (t.last > prev ? "up" : "down") : null;
        _tkPrev[t.market] = t.last;
        track.querySelectorAll(`.tk[data-market="${t.market}"]`).forEach((el) => {
          const up = t.pct >= 0;
          el.querySelector(".px").textContent = fmtPrice(t.last);
          const chg = el.querySelector(".chg");
          chg.className = "chg " + (up ? "up" : "down");   // 不要再掛 .num（膠囊自帶 tabular-nums）
          chg.textContent = (up ? "▲" : "▼") + Math.abs(t.pct).toFixed(2) + "%";
          if (dir) {   // 價格較上次變動 → 閃一下（漲=--up、跌=--down，依設定），再回歸原色
            el.classList.remove("flash-up", "flash-down");
            void el.offsetWidth;                 // 強制 reflow → 重啟動畫
            el.classList.add("flash-" + dir);
          }
        });
      });
    }
  } catch (e) { /* 靜默；下一輪再試 */ }
}

let _obTimer = null, _obMarket = "btctwd";
function renderOrderbook(d) {
  const el = $("ob-body");
  if (!el) return;
  const asks = (d.asks || []).slice(0, 12), bids = (d.bids || []).slice(0, 12);
  if (d.error || (!asks.length && !bids.length)) { el.innerHTML = `<div class="cidx-empty">${escapeHtml(d.error || "此市場暫無深度資料")}</div>`; return; }
  const maxV = Math.max(1, ...asks.concat(bids).map((x) => +x[1] || 0));
  const row = (x, side) => `<div class="bk-row ${side}"><span class="bk-bar" style="width:${Math.min(100, (+x[1] / maxV) * 100)}%"></span>` +
    `<span class="bk-p">${(+x[0]).toLocaleString(undefined, { maximumFractionDigits: 4 })}</span>` +
    `<span class="bk-v">${(+x[1]).toFixed(4)}</span></div>`;
  const bestAsk = asks.length ? +asks[0][0] : 0, bestBid = bids.length ? +bids[0][0] : 0;
  const spread = (bestAsk && bestBid) ? bestAsk - bestBid : 0;
  el.innerHTML = asks.slice().reverse().map((a) => row(a, "ask")).join("") +
    `<div class="bk-spread">價差 ${spread.toLocaleString(undefined, { maximumFractionDigits: 2 })}${bestBid ? " · " + (spread / bestBid * 100).toFixed(3) + "%" : ""}</div>` +
    bids.map((b) => row(b, "bid")).join("");
}
