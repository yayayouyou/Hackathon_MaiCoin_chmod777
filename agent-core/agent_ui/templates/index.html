function fmtT(ms) {
  if (!ms) return "";
  const diff = (Date.now() - ms) / 1000, d = new Date(ms);
  if (diff < 3600) return Math.max(1, Math.floor(diff / 60)) + " 分前";
  if (diff < 86400) return Math.floor(diff / 3600) + " 小時前";
  if (diff < 86400 * 30) return Math.floor(diff / 86400) + " 天前";
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

/* ---------- 艙位成本與損益（P4）----------
   一次 /api/positions 同時填三個區塊：總覽的損益 hero、資產的艙位卡、紀錄的已實現損益。
   後端共用同一次 build_lots，前端也只發一次請求（冷啟動約 4.6s，故 lazy 載入）。
   顏色一律用 .up/.down class，跟隨使用者的紅漲/綠漲設定。 */
let _posMethod = "fifo";

const _prnd = (v, dp) => { const n = +(+v).toFixed(dp == null ? 2 : dp); return Object.is(n, -0) ? 0 : n; };
const _pnf = (v, dp) => (v == null ? "—" : _prnd(v, dp).toLocaleString(undefined, { maximumFractionDigits: dp == null ? 2 : dp }));
/* 顯示位數上四捨五入後才判正負 —— 否則 -0.4 會印成刺眼又無意義的 "-0" */
const _psgn = (v, dp) => (v != null && _prnd(v, dp) > 0 ? "+" : "");
const _pcls = (v, dp) => { const n = v == null ? 0 : _prnd(v, dp); return n > 0 ? "up" : n < 0 ? "down" : ""; };
/* 正負號與數字必須用同一個顯示位數判斷，分開算會出現 "+0" 這種矛盾 */
const _pmoney = (v, dp) => (v == null ? "—" : _psgn(v, dp) + _pnf(v, dp));

function _recChipHtml(rc) {
  const conf = rc.confidence || "low";
  const tone = conf === "high" ? "var(--up)" : conf === "partial" ? "#e8a03d" : "var(--down)";
  const label = conf === "high"
    ? `資料完整 · ${rc.matched}/${rc.currencies} 幣種對得上，損益可信`
    : conf === "partial"
      ? `部分對得上 · ${rc.matched}/${rc.currencies} 幣種，其餘有缺口`
      : `帳本與實際餘額不符 · 損益僅供參考`;
  const rows = (rc.rows || []).filter((x) => !x.ok).map((x) =>
    `<div class="rec-row"><span class="rc">${escapeHtml(x.currency)}</span>` +
    `<span class="rd">${escapeHtml(x.diagnosis || "")}</span>` +
    `<span class="rg ${_pcls(x.gap)}">${_pmoney(x.gap, 8)}</span></div>`).join("");
  return `<button class="rec-chip" onclick="this.nextElementSibling.classList.toggle('open')">` +
    `<span class="rc-dot" style="background:${tone}"></span><span>資料可信度：${escapeHtml(label)}</span>` +
    `<span class="rc-arrow">明細 ▾</span></button>` +
    `<div class="rec-body">${rows || `<div class="pos-note">所有幣種都對得上。</div>`}` +
    `<div class="pos-note">${escapeHtml(rc.note || "")}</div></div>`;
}

async function loadPositions(el, opts) {
  opts = opts || {};
  const heroBox = el.querySelector("#dash-pnl");
  if (!heroBox) return;
  const posBox = el.querySelector("#dash-positions");
  const reaBox = el.querySelector("#dash-realized");
  if (opts.method) _posMethod = opts.method;
  heroBox.innerHTML = `<div class="cidx-empty" style="padding:12px">損益計算中…（重播帳本、回推歷史成本）</div>`;

  let d = null;
  try {
    d = await (await fetch(`/api/positions?method=${_posMethod}` + (opts.sync ? "&sync=1" : ""))).json();
  } catch (e) { d = null; }
  if (!d || !d.ok) {
    heroBox.innerHTML = `<div class="cidx-empty" style="padding:12px">尚未連接 MAX 帳戶 · 於 .env 設定 API 金鑰後可算損益</div>`;
    return;
  }

  // ── 總覽：損益 hero + 對帳可信度 ──
  const t = d.totals || {}, r = d.realized || {};
  const uz = t.total_unrealized_pnl_twd, rz = r.total_twd;
  heroBox.innerHTML =
    `<div class="pnl-hero">` +
    `<div class="ph"><span class="k">未實現損益</span>` +
    `<span class="big ${_pcls(uz, 0)}">${_pmoney(uz, 0)}</span>` +
    `<span class="sub">成本 ${_pnf(t.total_cost_twd, 0)} → 市值 ${_pnf(t.total_value_twd, 0)} TWD` +
    (t.total_unrealized_pnl_pct != null ? ` · ${_psgn(t.total_unrealized_pnl_pct)}${t.total_unrealized_pnl_pct}%` : "") + `</span></div>` +
    `<div class="ph"><span class="k">已實現損益</span>` +
    `<span class="big ${_pcls(rz, 0)}">${_pmoney(rz, 0)}</span>` +
    `<span class="sub">${r.closes || 0} 次平倉 · 依歷史買入批次配對</span></div>` +
    `</div>` + _recChipHtml(d.reconcile || {});

  // 對帳分類：差異明細直接展開，不再是「點 chip 才看得到」
  const recBox = el.querySelector("#dash-reconcile");
  if (recBox) {
    const rc = d.reconcile || {};
    const rows = (rc.rows || []);
    const bad = rows.filter((x) => !x.ok);
    recBox.innerHTML =
      `<div class="dash-sec">對帳結果 · ${rc.matched || 0}/${rc.currencies || 0} 幣種相符</div>` +
      `<div class="desk-strip" style="margin-bottom:10px">` +
      `<div class="dk"><span class="dk-k">帳本事件</span><span class="dk-v num" style="font-size:19px">${_pnf(d.ledger_events, 0)}</span></div>` +
      `<div class="dk"><span class="dk-k">相符</span><span class="dk-v num up" style="font-size:19px">${rc.matched || 0}</span></div>` +
      `<div class="dk"><span class="dk-k">有差異</span><span class="dk-v num" style="font-size:19px;color:var(--warn)">${rc.mismatched || 0}</span></div>` +
      `</div>` +
      (bad.length
        ? `<div class="dash-sec">差異與成因</div>` + bad.map((x) =>
            `<div class="rec-row"><span class="rc">${escapeHtml(x.currency)}</span>` +
            `<span class="rd">${escapeHtml(x.diagnosis || "")}</span>` +
            `<span class="rg">${_psgn(x.gap, 8)}${_pnf(x.gap, 8)}</span></div>`).join("")
        : `<div class="cidx-empty" style="padding:12px">所有幣種都對得上。</div>`) +
      `<div class="pos-note">${escapeHtml(rc.note || "")}</div>`;
  }

  // ── 資產：艙位卡（可展開批次組成）──
  if (posBox) {
    const ps = d.positions || [];
    let ph = `<div class="dash-sec">艙位成本與損益 · 總持有（含質押）</div>` +
      `<div class="mth-tog">` +
      ["fifo", "average"].map((m) =>
        `<button class="mt ${m === _posMethod ? "active" : ""}" data-mth="${m}">${m === "fifo" ? "先進先出" : "移動平均"}</button>`).join("") +
      `<span class="mt-hint">成本配對法</span></div>`;
    if (!ps.length) {
      ph += `<div class="cidx-empty" style="padding:12px">目前沒有未平艙位。</div>`;
    } else {
      ps.forEach((p) => {
        const gaps = (p.qty_gap_vs_exchange != null && Math.abs(p.qty_gap_vs_exchange) > 1e-9)
          ? `<div class="pos-note">${icon("alert",11)} 帳本與交易所餘額差 ${_pnf(p.qty_gap_vs_exchange, 8)}，已以交易所為準調整。</div>` : "";
        const gs = p.lot_groups || [];
        // 只列「有份量」的組；小到看不出差別的折成一行 —— MAX 有 359 個批次，多是微額獎勵
        const floor = Math.max(1, (p.cost_twd || 0) * 0.01);
        const big = gs.filter((g) => g.cost_twd >= floor).slice(0, 10);
        const small = gs.filter((g) => big.indexOf(g) < 0);
        let lots = big.map((g) =>
          `<div class="lot-row"><span class="lt">${escapeHtml(g.period)}</span>` +
          `<span class="ld">${escapeHtml(g.source)} · ${_pnf(g.qty, 6)} @ ${_pnf(g.avg_cost_twd, 4)} · ${g.lots} 筆` +
          (g.basis !== "known" ? ` <span class="basis-tag warn">成本${g.basis === "unknown" ? "不可考" : "部分推估"}</span>` : "") + `</span>` +
          `<span class="lp ${_pcls(g.unrealized_pnl_twd, 0)}">${_pmoney(g.unrealized_pnl_twd, 0)}</span></div>`).join("");
        if (small.length) {
          const sq = small.reduce((a, g) => a + g.qty, 0);
          const sc = small.reduce((a, g) => a + g.cost_twd, 0);
          const sp = small.reduce((a, g) => a + (g.unrealized_pnl_twd || 0), 0);
          lots += `<div class="lot-row"><span class="lt">其餘</span>` +
            `<span class="ld">${small.length} 組小額（多為質押獎勵）· ${_pnf(sq, 6)} · 成本 ${_pnf(sc, 0)} TWD</span>` +
            `<span class="lp ${_pcls(sp, 0)}">${_pmoney(sp, 0)}</span></div>`;
        }
        ph += `<div class="pos-card"><div class="pos-head">` +
          `<div><div class="pc">${escapeHtml(p.currency)}` +
          (p.basis_known_pct < 100 ? ` <span class="basis-tag${p.basis_known_pct < 60 ? " warn" : ""}">成本可追溯 ${p.basis_known_pct}%</span>` : "") + `</div>` +
          `<div class="pq">${_pnf(p.qty, 8)}` +
          `<span class="sep"><i class="dot">·</i>均成本 ${_pnf(p.avg_cost_twd, 4)}</span>` +
          `<span class="sep"><i class="dot">·</i>現價 ${_pnf(p.price_twd, 4)}</span></div></div>` +
          `<div><div class="pp ${_pcls(p.unrealized_pnl_twd)}">${_pmoney(p.unrealized_pnl_twd, 0)}</div>` +
          `<div class="ppp">${p.unrealized_pnl_pct != null ? _psgn(p.unrealized_pnl_pct) + p.unrealized_pnl_pct + "%" : "—"} · ${p.lots} 批次 ▾</div></div>` +
          `</div><div class="pos-body">` +
          `<div class="dash-sec" style="margin-top:8px">買入批次組成 · 依月份與來源</div>${lots}${gaps}` +
          `<div class="pos-note">市值 ${_pnf(p.value_twd, 0)} TWD · 總成本 ${_pnf(p.cost_twd, 0)} TWD</div>` +
          `</div></div>`;
      });
    }
    const um = Object.entries(d.unmatched_qty || {});
    if (um.length) {
      ph += `<div class="pos-note">ℹ️ 有賣出配不到買入批次（${um.map(([c, v]) => escapeHtml(c) + " " + _pnf(v, 6)).join("、")}），` +
        `因 MAX 只提供 2023-02 之後的成交紀錄，這部分已排除在損益之外 —— 實際損益會比顯示的更大。</div>`;
    }
    posBox.innerHTML = ph;
    posBox.querySelectorAll(".pos-head").forEach((hd) =>
      hd.addEventListener("click", () => hd.nextElementSibling.classList.toggle("open")));
    posBox.querySelectorAll(".mt").forEach((btn) =>
      btn.addEventListener("click", () => loadPositions(el, { method: btn.dataset.mth })));
  }

  // ── 紀錄：已實現損益 + 賣出↔買入配對明細 ──
  if (reaBox) {
    let rh = `<div class="dash-sec">已實現損益 · ${r.closes || 0} 次平倉</div>`;
    if (!(r.by_currency || []).length) {
      rh += `<div class="cidx-empty" style="padding:12px">還沒有已平倉的紀錄。</div>`;
    } else {
      rh += `<div class="dash-mkts">` + r.by_currency.map((s) =>
        `<span class="mkt-chip">${escapeHtml(s.currency)} <b class="${_pcls(s.realized_pnl_twd, 0)}">${_pmoney(s.realized_pnl_twd, 0)}</b>` +
        (s.return_pct != null ? ` · ${s.return_pct}%` : "") + (s.win_rate_pct != null ? ` · 勝率 ${s.win_rate_pct}%` : "") + `</span>`).join("") + `</div>`;
      const fees = Object.entries(r.fee_cost_twd || {});
      if (fees.length) {
        rh += `<div class="pos-note">手續費成本：` +
          fees.sort((a, b) => b[1] - a[1]).map(([c, v]) => `${escapeHtml(c)} ${_pnf(v, 0)}`).join(" · ") + ` TWD</div>`;
      }
      rh += `<div class="dash-sec">最近平倉 · 點開看平掉哪些買入批次</div>`;
      const dust = (r.recent || []).filter((x) => Math.abs(x.proceeds_twd) < 1 && Math.abs(x.cost_twd) < 1);
      (r.recent || []).filter((x) => dust.indexOf(x) < 0).forEach((x) => {
        const ml = (x.matched_lots || []).map((m) =>
          `<div class="lot-row"><span class="lt">${escapeHtml(String(m["買入日"]))}</span>` +
          `<span class="ld">平掉 ${_pnf(m["數量"], 8)} @ 成本 ${_pnf(m["成本單價"], 4)}` +
          (m["成本來源"] !== "known" ? ` <span class="basis-tag warn">${m["成本來源"] === "unknown" ? "成本不可考" : escapeHtml(String(m["成本來源"]))}</span>` : "") +
          `</span><span class="lp"></span></div>`).join("");
        rh += `<div class="pos-card"><div class="pos-head">` +
          `<div><div class="pc" style="font-size:12.5px">${escapeHtml(x.currency)} ${_pnf(x.qty, 8)}</div>` +
          `<div class="pq">${escapeHtml(x.time)} · 收 ${_pnf(x.proceeds_twd, 0)} / 成本 ${_pnf(x.cost_twd, 0)} TWD` +
          (x.holding_days != null ? ` · 持有 ${x.holding_days} 天` : "") + `</div></div>` +
          `<div><div class="pp ${_pcls(x.pnl_twd, 0)}" style="font-size:13px">${_pmoney(x.pnl_twd, 0)}</div>` +
          `<div class="ppp">${x.pnl_pct != null ? _psgn(x.pnl_pct) + x.pnl_pct + "%" : "—"} ▾</div></div>` +
          `</div><div class="pos-body">${ml}</div></div>`;
      });
      if (dust.length) rh += `<div class="pos-note">另有 ${dust.length} 筆零星平倉（金額不足 1 TWD）未列出。</div>`;
    }
    reaBox.innerHTML = rh;
    reaBox.querySelectorAll(".pos-head").forEach((hd) =>
      hd.addEventListener("click", () => hd.nextElementSibling.classList.toggle("open")));
  }
}

  }

    h += `<div class="dash-sec" style="margin-top:12px">閃兌記錄 · ${d.converts.length} 筆</div><div class="act-list">`;
    d.converts.forEach((c) => {
      h += `<div class="act-row"><span class="act-t">🔁</span>` +
        `<span class="act-conv">${(c.from_amount || 0).toLocaleString(undefined, { maximumFractionDigits: 8 })} ${escapeHtml(c.from_currency)} → ${(c.to_amount || 0).toLocaleString(undefined, { maximumFractionDigits: 8 })} ${escapeHtml(c.to_currency)}</span>` +
        `<span class="act-time">${fmtT(c.time_ms)}</span></div>`;

  if ((d.withdraw_addresses || []).length) {

  box.innerHTML = h || `<div class="cidx-empty" style="padding:12px">目前沒有資金動態</div>`;

async function loadDepositSources(box) {
  if (!box) return;
  let d;
  try { d = await (await fetch("/api/deposit_sources")).json(); }
  catch { box.innerHTML = `<div class="cidx-empty" style="padding:12px">溯源載入失敗</div>`; return; }
  if (!d || d.error) { box.innerHTML = `<div class="cidx-empty" style="padding:12px">尚未連接 MAX 帳戶，或這筆入金查不到鏈上來源</div>`; return; }
  let h = `<div class="dsrc-sum">${escapeHtml(d.summary || "")}</div>`;
  const rows = (d.deposits || []).filter((x) => x.sender || x.note);
  if (rows.length) {
    h += `<div class="act-list">`;
    rows.forEach((x) => {
      const riskCls = x.risk === "elevated" ? "risk-hi" : (x.risk === "known" || x.risk === "low" ? "risk-lo" : "");
      const src = x.source_type || x.note || "";
      h += `<div class="act-row"><span class="act-t">${icon("inbox",12)}</span>` +
        `<span class="act-c">${escapeHtml(x.currency || "")}</span>` +
        `<span class="act-a num">${(x.amount != null ? x.amount : 0).toLocaleString(undefined, { maximumFractionDigits: 8 })}</span>` +
        `<span class="act-addr num">${escapeHtml(x.sender || "")}</span>` +
        `<span class="act-d ${riskCls}">${escapeHtml(src)}</span></div>`;
    });
    h += `</div>`;
  }
  const sk = d.skipped || {};
  const skTxt = Object.entries(sk).filter(([, v]) => v > 0).map(([k, v]) => `${k.split("_")[1] || k} ${v}`).join("、");
  if (skTxt) h += `<div class="trait" style="opacity:.6;margin-top:6px">無鏈上來源：${escapeHtml(skTxt)}（站內轉帳/法幣入金查不到鏈上發送方）</div>`;
  box.innerHTML = h;
}
function showPnlCard() {

function rasterizeSvgToPng(svg) {
  const img = new Image();
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
  img.onload = () => {
    const scale = 2, W = 480, H = 600;
    const c = document.createElement("canvas"); c.width = W * scale; c.height = H * scale;
    const ctx = c.getContext("2d"); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    try {
      const a = document.createElement("a"); a.download = "maia-pnl-card.png"; a.href = c.toDataURL("image/png"); a.click();
    } catch (e) { alert("PNG 轉換失敗，請改用「下載 SVG」。"); }
  };
  img.onerror = () => alert("PNG 轉換失敗，請改用「下載 SVG」。");
  img.src = url;
}

/* 一行式提示條：用於「操作沒有生效」的情境，取代靜默失敗。
   自動消失，不打斷正在進行的事，也不需要使用者關閉。 */

/* ---------- 圖表穿插（generative UI 錨點）----------
   業界做法是「元件綁定到工具，由工具呼叫決定渲染」，而不是掃描文字關鍵字決定要不要插圖
   （關鍵字法必然誤判：講到「均線」不代表那裡該有圖）。這裡再加一層「位置」：
   模型在答案裡寫一個錨點標記，前端按**產生順序**把圖表卡搬到該位置。

   支援兩種寫法（對小模型友善）：
     [圖表]            → 依序取用下一張尚未安置的圖
     [圖表:工具名]     → 指名要哪張（例如 [圖表:run_backtest]）
   沒有錨點時完全不改變現有行為（圖表留在答案上方），不會因為模型不配合而壞掉。 */
const CHART_ANCHOR_RE = /\[圖表(?::\s*([A-Za-z0-9_]+))?\]/g;

function placeChartsInline(botMsg, contEl, markdown, charts) {
    if (!botMsg || !contEl || !charts || !charts.length) return false;
    CHART_ANCHOR_RE.lastIndex = 0;
    if (!CHART_ANCHOR_RE.test(markdown)) return false;   // 沒錨點 → 維持原本排版
    CHART_ANCHOR_RE.lastIndex = 0;

    const pool = charts.filter((c) => c.card && c.card.parentNode);
    const used = new Set();
    const takeChart = (tool) => {
      let i = -1;
      if (tool) i = pool.findIndex((c, k) => !used.has(k) && c.tool === tool);
      if (i < 0) i = pool.findIndex((c, k) => !used.has(k));
      if (i < 0) return null;
      used.add(i);
      return pool[i].card;
    };

    // 依錨點把 markdown 切段，逐段渲染，段與段之間放圖表卡
    const frag = document.createDocumentFragment();
    let last = 0, m, placed = 0;
    const pushText = (md) => {
      const t = md.trim();
      if (!t) return;
      const d = document.createElement("div");
      d.className = "content";
      d.innerHTML = formatMarkdown(t);
      frag.appendChild(d);
    };
    while ((m = CHART_ANCHOR_RE.exec(markdown)) !== null) {
      pushText(markdown.slice(last, m.index));
      const card = takeChart(m[1]);
      if (card) { frag.appendChild(card); placed++; }   // appendChild 會把卡片從原位置搬過來
      last = m.index + m[0].length;
    }
    pushText(markdown.slice(last));
    if (!placed) return false;                          // 一張都沒搬成 → 不動原本排版

    contEl.innerHTML = "";
    contEl.appendChild(frag);
    // 沒被錨點指名的圖表，維持在答案之後（不要憑空消失）
    pool.forEach((c, k) => { if (!used.has(k)) threadEl.appendChild(c.card); });
    return true;
}

function provMeta(name, result) {
  const r = result && typeof result === "object" ? result : null;
  const bits = [];
  if (!r) return bits;
  // 對帳可信度：這是本站最重要的信任指標，一定要浮出來
  const conf = r.confidence || (r.reconcile && r.reconcile.confidence);
  if (conf) {
    const m = r.matched != null ? r.matched : (r.reconcile || {}).matched;
    const t = r.currencies != null ? r.currencies : (r.reconcile || {}).currencies;
    bits.push({ k: "對帳", v: `${conf === "high" ? "全部相符" : conf === "partial" ? "部分相符" : "有缺口"}` +
                              (m != null && t != null ? ` ${m}/${t}` : ""), warn: conf !== "high" });
  }
  if (r.method) bits.push({ k: "配對法", v: r.method === "average" ? "移動平均" : "先進先出" });
  if (r.events != null) bits.push({ k: "帳本", v: `${(+r.events).toLocaleString()} 筆事件` });   // 稽核數字不壓縮
  if (r.closes != null) bits.push({ k: "平倉", v: `${r.closes} 次` });
  if (Array.isArray(r.positions)) bits.push({ k: "艙位", v: `${r.positions.length} 個幣種` });
  if (r.avg_basis_coverage_pct != null) bits.push({ k: "成本可追溯", v: `${r.avg_basis_coverage_pct}%` });
  if (Array.isArray(result) && result.length) bits.push({ k: "筆數", v: `${result.length} 筆` });
  return bits;
}

/* 分級免責：強度由本輪實際跑過的工具推導，不靠模型自己記得寫（小模型很容易漏）。
   三級——
     exec  涉及下單／改變資金狀態
     acct  用到使用者的實際部位、成本、損益
     info  一般行情與知識問答
   業界（幣安全站逐字重複同一段、OKX 用更強的字句）的共識是：免責是固定元件，
   不是每次現寫；而且依內容風險分級用不同強度。 */
const DISC_EXEC = new Set(["create_order", "cancel_order", "cancel_all_orders"]);
const DISC_ACCT = new Set([
  "get_open_positions", "get_realized_pnl", "reconcile_holdings", "get_cost_basis_positions",
  "get_max_accounts", "get_max_my_trades", "get_max_orders", "get_max_order_history",
  "analyze_portfolio", "calculate_position_size", "calculate_pnl", "calculate_average_down",
  "trace_deposit_source", "get_max_fund_transactions",
]);
function disclaimerFor(prov) {
  const names = (prov || []).map((p) => p.name);
  if (names.some((n) => DISC_EXEC.has(n)))
    return { tier: "exec", text: "以上涉及實際下單操作。請自行再次核對數量與價格 —— 一旦送出即無法由本系統撤回。" };
  if (names.some((n) => DISC_ACCT.has(n)))
    return { tier: "acct", text: "以上用到你的實際部位與成本資料。數字受限於交易所提供的歷史完整度（見對帳狀態），" +
                                 "僅供你自己核對，不構成投資建議。" };
  return { tier: "info", text: "以上為公開資料的統計整理，不構成投資建議。加密資產波動大，請自行判斷並控制風險。" };
}

function renderProvenance(host, prov) {
  if (!host) return;
  const ok = (prov || []).filter((p) => !p.failed);
  if (!ok.length) {

    only.className = "prov";
    only.innerHTML = `<div class="prov-disc ${d.tier}">${escapeHtml(d.text)}</div>`;
    host.appendChild(only);

  const wrap = document.createElement("div");
  wrap.className = "prov";
  wrap.innerHTML =
    `<div class="prov-row">` +
    `<span class="prov-lead">依據</span>` +
    ok.map((p, i) => {
      const warn = p.bits.some((b) => b.warn);
      return `<button class="prov-chip${warn ? " warn" : ""}" data-i="${i}">` +
             `<span class="pc-n">${i + 1}</span>${escapeHtml(toolLabel(p.name))}` +
             (p.bits.length ? `<span class="pc-m">${escapeHtml(p.bits[0].v)}</span>` : "") +

    }).join("") +
    `<span class="prov-time num">${nowTime()}</span>` +

    (() => { const d = disclaimerFor(prov);          // 免責是固定元件，強度依本輪工具分級
             return `<div class="prov-disc ${d.tier}">${escapeHtml(d.text)}</div>`; })() +
    ok.map((p, i) =>
      `<div class="prov-body" data-i="${i}" hidden>` +

      (p.bits.length
        ? p.bits.map((b) => `<div class="pb-row"><span class="pb-k">${escapeHtml(b.k)}</span>` +
                            `<span class="pb-v num${b.warn ? " warn" : ""}">${escapeHtml(b.v)}</span></div>`).join("")
        : `<div class="pb-row"><span class="pb-k">已執行，無額外統計</span></div>`) +
      `</div>`).join("");
  host.appendChild(wrap);
  wrap.querySelectorAll(".prov-chip").forEach((btn) => btn.addEventListener("click", () => {
    const body = wrap.querySelector(`.prov-body[data-i="${btn.dataset.i}"]`);

    wrap.querySelectorAll(".prov-body").forEach((b) => { b.hidden = true; });
    wrap.querySelectorAll(".prov-chip").forEach((b) => b.classList.remove("open"));
    if (opening) { body.hidden = false; btn.classList.add("open"); }
  }));
}

/* 工具名 → 使用者看得懂的動作。依前綴比對，新工具不必逐一登記也有合理落點。 */
function toolLabel(name) {
  const n = String(name || "");
  const exact = {
    get_open_positions: "計算艙位成本", get_realized_pnl: "配對已實現損益",
    reconcile_holdings: "資金對帳", get_cost_basis_positions: "追溯成本來源",
    get_max_my_trades: "查詢成交紀錄", get_max_accounts: "讀取帳戶餘額",
    trace_deposit_source: "追查入金來源", run_analyst_desk: "彙整分析台",
    search_web_duckduckgo: "搜尋網路", get_latest_crypto_news: "讀取新聞",

  if (exact[n]) return exact[n];

/* Dock 寬度可拖曳調整並記憶 —— 固定 360px 在不同螢幕上的佔比差很多，
   而它的內容量本來就時多時少。 */
(function(){
  const dock = document.querySelector(".dock"), grip = document.getElementById("dock-grip");
  if (!dock || !grip) return;
  const saved = parseInt(localStorage.getItem("maia-dock-w") || "", 10);
  if (saved >= 240 && saved <= 560) document.documentElement.style.setProperty("--dock-w", saved + "px");
  let startX = 0, startW = 0;
  const move = (e) => {
    const w = Math.min(560, Math.max(240, startW + (startX - e.clientX)));
    document.documentElement.style.setProperty("--dock-w", w + "px");
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    grip.classList.remove("dragging");
    document.body.classList.remove("dock-resizing");
    const w = parseInt(getComputedStyle(dock).width, 10);
    try { localStorage.setItem("maia-dock-w", String(w)); } catch (e) {}
  };
  grip.addEventListener("mousedown", (e) => {
    e.preventDefault();
    startX = e.clientX; startW = parseInt(getComputedStyle(dock).width, 10);
    grip.classList.add("dragging");
    document.body.classList.add("dock-resizing");
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
})();

/* 風控防線狀態 —— 實盤時最需要一眼看到「現在能不能下單、今天下了多少」 */
async function loadGuard(el) {

  let h = `<div class="dash-sec">交易防線</div>` +
    `<div class="desk-strip" style="margin-bottom:10px">` +
    `<div class="dk"><span class="dk-k">生效模式</span>` +
      `<span class="dk-v" style="font-size:17px;color:${modeTone}">` +
      `${d.effective_mode === "live" ? "實盤" : d.effective_mode === "halted" ? "已停手" : "模擬盤"}</span>` +
      `<span class="dk-s">${escapeHtml(d.mode_note || "")}</span></div>` +
    `<div class="dk"><span class="dk-k">近 ${ex.window_hours || 24} 小時下單</span>` +
      `<span class="dk-v num" style="font-size:19px">${_pnf(ex.notional_twd, 0)}</span>` +
      `<span class="dk-s num">上限 ${_pnf(ex.max_notional_twd, 0)} TWD · ${ex.orders || 0}/${ex.max_orders || 0} 筆</span></div>` +
    `<div class="dk"><span class="dk-k">停止開關</span>` +
      `<span class="dk-v" style="font-size:17px;color:${ks.engaged ? "var(--warn)" : "var(--up)"}">` +
      `${ks.engaged ? "已啟動" : "未啟動"}</span>` +
      `<span class="dk-s">建立該檔案即全面停手</span></div></div>`;
  const recs = d.recent_decisions || [];
  h += `<div class="dash-sec">下單決策紀錄 · 含被擋下的</div>`;
  h += recs.length
    ? `<div class="act-list">` + recs.map((r) => {
        const ok = r.decision === "SUBMITTED";
        return `<div class="act-row"><span class="act-c ${ok ? "" : "risk-hi"}">${escapeHtml(r.decision)}</span>` +
               `<span class="act-d">${escapeHtml(r.market || "")} ${escapeHtml(r.side || "")}</span>` +
               `<span class="act-a num">${_pnf(r.notional_twd, 0)} TWD</span>` +
               `<span class="act-time">${escapeHtml(String(r.ts || "").slice(5, 16).replace("T", " "))}</span></div>`;
      }).join("") + `</div>`
    : `<div class="cidx-empty" style="padding:12px">尚無下單紀錄。</div>`;
  h += `<div class="pos-note">${escapeHtml(d.note || "")}</div>`;
  box.innerHTML = h;
}

/* 系統狀態展開：點狀態點開合、點外面或 Esc 關閉 */
(function(){
  const btn = $("sysdot"), pop = $("syspop");
  if (!btn || !pop) return;
  const set = (on) => {
    if (on) {   // 對齊觸發按鈕的左緣，並確保不超出視窗右側
      const r = btn.getBoundingClientRect();
      pop.style.left = Math.min(r.left, window.innerWidth - 244) + "px";
      pop.style.top = (r.bottom + 6) + "px";
      pop.style.right = "auto";
    }
    pop.hidden = !on;
    btn.setAttribute("aria-expanded", on ? "true" : "false");
  };
  btn.addEventListener("click", (e) => { e.stopPropagation(); set(pop.hidden); });
  document.addEventListener("click", (e) => { if (!pop.hidden && !pop.contains(e.target)) set(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !pop.hidden) { set(false); btn.focus(); } });
})();

/* 頂欄帳戶入口的未實現損益：沿用 /api/positions（後端已快取帳本，不重複計算）。
   失敗就維持「—」——寧可不顯示，也不顯示可能過期的損益數字。 */
let _posPromise = null;
function fetchPositions() {          // 共用同一個 in-flight 請求，避免重複觸發帳本同步
  if (!_posPromise) _posPromise = fetch("/api/positions").then((r) => r.json())
    .catch(() => null).finally(() => { setTimeout(() => { _posPromise = null; }, 30000); });
  return _posPromise;
}
async function loadTopbarPnl() {

    el.className = "acct-pnl num " + _pcls(v, 0);

}

   用屬性而非直接寫 SVG，是為了讓 HTML 保持可讀、也讓圖示只有一個定義來源。 */
function hydrateIcons(root) {
  (root || document).querySelectorAll("i[data-icon]").forEach((el) => {

/* 點左側歷史 → 拉完整 session、清空後逐輪重播（訊息 + 用 tool_result 重繪當時的圖表） */
async function replaySession(id) {
  if (streaming) return;
  let s;
  try { s = await (await fetch(`/api/session/${encodeURIComponent(id)}`)).json(); }
  catch (e) { console.error("載入 session 失敗", e); return; }
  if (!s || !Array.isArray(s.turns)) return;
  clearThreadDom();
  currentSessionId = s.id || id;          // 繼續這個 session（之後發話會接續存檔）
  welcomeEl.style.display = "none";
  for (const turn of s.turns) {
    appendUserMsg(turn.user || "");
    messages.push({ role: "user", content: turn.user || "" });
    const botMsg = appendBotMsg();
    botMsg.querySelector(".thinking")?.remove();     // 重播不需思考動畫
    const toolsEl = botMsg.querySelector(".tools");
    const contEl = botMsg.querySelector(".content");
    let finalContent = "", primaryViz = 0;
    const ambient = [], replayProv = [];
    for (const step of (turn.steps || [])) {
      if (step.type === "persona") {
        const chip = document.createElement("span");
        chip.className = "persona-chip";
        chip.innerHTML = `<span class="persona-ava">${escapeHtml(step.icon || "🎭")}</span>`
                       + `${escapeHtml(step.name || "")}`;
        toolsEl.appendChild(chip);
      } else if (step.type === "tool_call") {
        const chip = document.createElement("span");
        chip.className = "tool-chip done";
        chip.innerHTML = `✓ ${escapeHtml(step.name || "")}`;
        toolsEl.appendChild(chip);
      } else if (step.type === "tool_result") {
        const failed = step.result && typeof step.result === "object" && step.result.error;
        replayProv.push({ name: step.name, failed: !!failed, bits: failed ? [] : provMeta(step.name, step.result) });
        if (!failed) {
          if (AMBIENT_TOOLS.has(step.name)) ambient.push(step);
          else { const before = chartCount; tryRenderChart(step.name, step.result); if (chartCount > before) primaryViz++; }
        }
      } else if (step.type === "final_answer") {
        finalContent = step.content || "";
      }
    }
    if (primaryViz === 0) ambient.forEach((a) => tryRenderChart(a.name, a.result));
    contEl.innerHTML = formatMarkdown(finalContent);
    renderProvenance(contEl, replayProv);
    messages.push({ role: "assistant", content: finalContent });
    threadEl.appendChild(botMsg);          // 移到圖表下方（與 live 排版一致）
  }
  autoScroll();
}

/* ---------- 送出訊息（SSE 串流） ---------- */
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || streaming) return;
  // 模型清單還沒載入完就送出 → 後端會拿到空/不存在的模型而失敗。
  // 原本這裡是靜默 return，使用者點了建議卻毫無反應，看起來像壞掉。
  if (!modelSel.value) {
    noticeBar("模型清單還在載入，稍候再試 —— 或點右上 ⚙ 檢查 Ollama 位址");
    return;
  }

  inputEl.value = "";
  inputEl.style.height = "auto";
  streaming = true;
  btnSend.disabled = true;
  btnStop.classList.add("on");
  welcomeEl.style.display = "none";
  threadEl._pinned = true;   // 送出新訊息 → 重新貼底（使用者主動發話時一定要看到最新內容）

  const personaName = personaSel.options[personaSel.selectedIndex]?.text || "";
  logTerm("status", `[系統] 啟動會話 — 模型 <b>${escapeHtml(modelSel.value)}</b> · 風格 ${escapeHtml(personaName)}`);

  const userMsg = appendUserMsg(text);
  messages.push({ role: "user", content: text });

  const botMsg = appendBotMsg();
  // ChatGPT/Claude 式錨定：下方預留約一個視窗高度，把剛送出的問題平滑捲到接近頂端，
  // 答案就在問題正下方串流長出（消除「回覆前下方一片空白、又得手動往上拉」的突兀感）。
  botMsg.style.minHeight = "calc(100dvh - 210px)";
  requestAnimationFrame(() => {
    userMsg.scrollIntoView({ behavior: "smooth", block: "start" });
    threadEl._pinned = false;   // 已錨定頂端 → 串流時不再硬拉回底部，讓答案在問題下方自然長出
  });
  const bubble  = botMsg.querySelector(".bubble");
  const toolsEl = botMsg.querySelector(".tools");
  const thinkEl = botMsg.querySelector(".thinking");
  const contEl  = botMsg.querySelector(".content");
  const statEl  = botMsg.querySelector(".thinking .stat");
  const elapsedEl = botMsg.querySelector(".elapsed");
  const warmEl  = botMsg.querySelector(".warm");
  const toolChips = [];  // {name, el, done}
  const provenance = [];  // 本輪跑過的工具＋可稽核事實 → 答案下方的來源標記（E）
  const turnCharts = [];  // 本輪產生的圖表卡（含來源工具），供答案內錨點取用

  const t0 = Date.now();
  let _lastS = -1;
  const timer = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);   // 一律以 Date.now 為準（準確）
    if (s !== _lastS) {                                // 250ms 檢查、僅整秒變動才改文字 → 平滑不跳、不 stutter
      _lastS = s;
      elapsedEl.textContent = s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;
      if (s >= 20) warmEl.style.display = "block";
    }
  }, 250);
  const stopThinking = () => { clearInterval(timer); thinkEl.remove(); };
  // 串流答案：暫存 token + debounce 重繪（真實 token 串流；補半開標記後渲染，並跟隨最新行）
  let answerBuf = "", answerTimer = 0, answerStarted = false;
  const renderAnswer = () => {
    answerTimer = 0;
    contEl.innerHTML = formatMarkdown(closeOpenMarkdown(answerBuf));
    autoScroll();
  };
  const scheduleAnswer = () => { if (!answerTimer) answerTimer = setTimeout(renderAnswer, 50); };
  const resetAnswer = () => { answerBuf = ""; answerStarted = false; if (answerTimer) { clearTimeout(answerTimer); answerTimer = 0; } contEl.innerHTML = ""; };
  const fiveDim = {};   // 五維驗證：本輪各維度（價格/技術/衍生品/情緒/回測）最新訊號
  const pendingAmbient = [];   // 情境/輔助工具的圖表先緩衝；本輪若已有主要圖表則不推送（避免塞不重要資訊）
  let primaryVizShown = 0;     // 本輪已推送的「主要」圖表數

  abortCtrl = new AbortController();
  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: abortCtrl.signal,
      body: JSON.stringify({
        messages, model: modelSel.value, host: hostEl.value, persona: personaSel.value, session_id: currentSessionId,
      }),
    });
    if (!response.ok || !response.body) {
      stopThinking();
      // /api/chat 在登入牆後面，而這頁沒有登入畫面 —— 401 要講清楚是「沒登入」，不是設定壞了
      contEl.textContent = response.status === 401
        ? `尚未登入（HTTP 401）。這個對話頁沒有登入畫面：請先到像素世界（frontend-pixel 的 npm run dev 網址）註冊或登入，網址的主機名稱要跟本頁一樣（都用 ${location.hostname}），再重新整理本頁。本機 demo 也可以在 agent-core/.env 設 MAIA_LOCAL_NO_LOGIN=1 並重啟後端，就不用登入。`
        : `後端回應錯誤 (HTTP ${response.status})，請檢查設定。`;
      bubble.classList.add("error");
      logTerm("error", `[錯誤] HTTP ${response.status}`);
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const chunks = buffer.split("\n\n");
      buffer = chunks.pop();
      for (const chunk of chunks) {
        if (!chunk.startsWith("data: ")) continue;
        const raw = chunk.substring(6).trim();
        if (!raw) continue;
        try { handleStep(JSON.parse(raw)); }
        catch (e) {
          // 這裡的例外原本只進 console，畫面完全沒有痕跡 —— 來源標記消失就是這樣被藏起來的。
          console.error("SSE 步驟處理失敗", e, raw);
          logTerm("error", `[前端] 步驟處理失敗：${escapeHtml(String(e && e.message || e))}`);
        }
      }
    }

    function handleStep(step) {
      if (step.type === "status") {
        // 只改文字槽，不動整個 .stat（否則會連秒數一起洗掉）。
        // 秒數由 elapsedEl 單一來源持續更新，避免兩處不一致。
        const st = statEl && statEl.querySelector(".stat-txt");
        if (st) st.textContent = step.content;
        logTerm("status", escapeHtml(step.content));
      } else if (step.type === "persona") {
        window.__activePersona = step;
        const chip = document.createElement("span");
        chip.className = "persona-chip";
        chip.innerHTML = `<span class="persona-ava">${escapeHtml(step.icon || "🎭")}</span>`
                       + `${escapeHtml(step.name || "")}`;
        chip.title = "本次自動派發的分析角色（可於左側『助手風格』下拉鎖定特定角色）";
        toolsEl.appendChild(chip);
        logTerm("status", `本次由 <span class="persona-ava sm">${escapeHtml(step.icon || "🎭")}</span> <b>${escapeHtml(step.name || "")}</b> 上場分析`);
      } else if (step.type === "thinking") {
        logTerm("thought", `${icon("brain",12)} <span style="color:var(--ink-3)">內部思考</span>　${escapeHtml(step.content.slice(0, 700))}`);
      } else if (step.type === "thought") {
        logTerm("thought", escapeHtml(step.content));
      } else if (step.type === "tool_call") {
        // 狀態列報告「當下真正在做什麼」，而不是擬人化的「正在思考」——
        // 等待才有意義，使用者也能判斷卡在哪一步。
        const st = statEl && statEl.querySelector(".stat-txt");
        if (st) st.textContent = toolLabel(step.name);
        const chip = document.createElement("span");
        chip.className = "tool-chip";
        chip.innerHTML = `<span class="spin"></span>${escapeHtml(step.name)}`;
        toolsEl.appendChild(chip);
        toolChips.push({ name: step.name, el: chip, done: false });
        logTerm("tool", `⚙ 呼叫技能 <b>${escapeHtml(step.name)}</b>` +
          `<details><summary>參數</summary><pre>${escapeHtml(JSON.stringify(step.args, null, 2))}</pre></details>`);
        autoScroll();
      } else if (step.type === "tool_result") {
        _chartSink = turnCharts;   // 本輪的圖表都登記起來，供答案內的 [圖表] 錨點取用
        const failed = step.result && typeof step.result === "object" && step.result.error;
        // 先記錄來源再做呈現：handleStep 的例外只會進 console（見下方 catch），
        // 若排在 tryRenderChart 之後，圖表渲染一拋例外，整排來源標記就永遠不會出現。
        try {
          provenance.push({ name: step.name, failed: !!failed, bits: failed ? [] : provMeta(step.name, step.result) });
        } catch (e) { provenance.push({ name: step.name, failed: !!failed, bits: [] }); }
        const chip = toolChips.find((c) => c.name === step.name && !c.done);
        if (chip) {
          chip.done = true;
          chip.el.className = `tool-chip ${failed ? "fail" : "done"}`;
          chip.el.innerHTML = `${failed ? "✗" : "✓"} ${escapeHtml(step.name)}`;
        }
        const resStr = JSON.stringify(step.result, null, 2) || "";
        const preview = resStr.length > 500 ? resStr.slice(0, 500) + "…" : resStr;
        logTerm(failed ? "error" : "result",
          `${failed ? "✗" : "✓"} <b>${escapeHtml(step.name)}</b> 完成` +
          `<details><summary>結果（${compactNum(resStr.length)} 字元）</summary><pre>${escapeHtml(preview)}</pre></details>`);
        // 圖表相關性閘門：情境/輔助工具（如恐懼貪婪、全球統計）先緩衝，
        // 等 final_answer 時若本輪沒有任何主要圖表才顯示（代表它就是使用者問的重點）。
        if (!failed) {
          if (AMBIENT_TOOLS.has(step.name)) {
            pendingAmbient.push({ name: step.name, result: step.result });
          } else {
            const before = chartCount;
            tryRenderChart(step.name, step.result);
            if (chartCount > before) primaryVizShown++;
          }
        }
        const _ds = dimSignal(step.name, step.result);
        if (_ds) fiveDim[_ds.dim] = _ds;   // 累積五維訊號
      } else if (step.type === "approval_request") {
        const chip = toolChips.find((c) => c.name === step.name && !c.done);
        if (chip) { chip.done = true; chip.el.className = "tool-chip"; chip.el.innerHTML = `⏳ ${escapeHtml(step.name)}`; }
        renderApprovalCard(step);
        logTerm("status", `⏳ 訂單待人工核准：${escapeHtml(step.summary || "")}`);
      } else if (step.type === "reader") {
        const chip = toolChips.find((c) => c.name === step.name && c.done);
        if (chip && step.injection_detected) chip.el.innerHTML = `🛡️ ${escapeHtml(step.name)}`;
        const labels = (step.flags || []).map((f) => escapeHtml(f.label)).join(", ");
        logTerm(step.injection_detected ? "error" : "status",
          `${step.injection_detected ? "🛡️⚠️" : "🛡️"} Reader 淨化 <b>${escapeHtml(step.name)}</b>` +
          (step.injection_detected ? ` — 偵測到疑似注入並阻擋（${labels}）` : (step.reader_used ? "（已摘要）" : "（已圍欄）")));
        if (step.injection_detected) {
          const note = document.createElement("div");
          note.className = "reader-alert";
          note.innerHTML = `🛡️ <b>Reader 安全層</b>：<code>${escapeHtml(step.name)}</code> 的外部內容含疑似操縱 AI 的指令，已淨化後才交給大腦 — <b>未執行任何被注入的指令</b>。`;
          threadEl.appendChild(note);
          autoScroll();
        }
      } else if (step.type === "answer_delta") {
        if (!answerStarted) { answerStarted = true; stopThinking(); }   // 第一個 token → 收 spinner、露出答案
        answerBuf += step.content || "";
        scheduleAnswer();
      } else if (step.type === "answer_reset") {
        resetAnswer();                                                  // 本輪串流的是工具前導文字，清掉暫顯
      } else if (step.type === "final_answer") {
        stopThinking();
        if (answerTimer) { clearTimeout(answerTimer); answerTimer = 0; }
        answerBuf = "";
        contEl.innerHTML = formatMarkdown(step.content);               // 定版（權威 render）
        // 模型若在答案裡寫了 [圖表] 錨點 → 把圖表卡搬進文字之間；沒寫就維持原排版
        placeChartsInline(botMsg, contEl, step.content, turnCharts);
        renderProvenance(contEl, provenance);                          // 來源標記貼在答案下方（E）
        messages.push({ role: "assistant", content: step.content });
        // 本輪若沒有任何主要圖表，才把緩衝的情境圖表補上（表示它就是使用者的主題）；否則捨棄避免雜訊
        if (primaryVizShown === 0 && pendingAmbient.length) {
          pendingAmbient.forEach((a) => tryRenderChart(a.name, a.result));
        }
        // 把最終文字答案（整個泡泡）移到所有圖表卡片之後 → 結論落在圖表「下方」。
        // 圖表卡是串流時 append 到 threadEl、位置本來就在泡泡之後；不搬的話文字會被
        // 釘在最上方、擋在圖表前面（使用者回報的排版問題）。無圖表時此搬移為無害的 no-op。
        _chartSink = null;
        // 圖表已搬進答案時就不要再把泡泡沖到最後面（那會把圖表也一起帶走並反序）
        if (!botMsg.querySelector(".chart-card")) threadEl.appendChild(botMsg);
        renderFiveDim(fiveDim, botMsg);   // 覆蓋 ≥2 維時彙整成儀表，並貼在答案正下方
        logTerm("status", "[系統] 大腦決策結束 ✔");
        autoScroll();
      } else if (step.type === "error") {
        stopThinking();
        contEl.textContent = `錯誤：${step.content}`;
        bubble.classList.add("error");
        logTerm("error", `[錯誤] ${escapeHtml(step.content)}`);
      }
    }
  } catch (err) {
    stopThinking();
    if (err.name === "AbortError") {
      contEl.textContent = "已手動停止生成。";
      logTerm("status", "[系統] 使用者手動停止");
    } else {
      contEl.textContent = `對話出錯：${err}`;
      bubble.classList.add("error");
      logTerm("error", `[錯誤] ${escapeHtml(String(err))}`);
    }
  } finally {
    clearInterval(timer);
    streaming = false;
    abortCtrl = null;
    btnSend.disabled = false;
    btnStop.classList.remove("on");
    inputEl.focus();
    if (botMsg) botMsg.style.minHeight = "";   // 本輪結束 → 釋放預留空間（問題已錨定頂端，下方收合不影響視野）
    if (window.__reloadHistory) window.__reloadHistory();   // 本輪已存檔 → 刷新左側歷史（新/更新的 session 立即出現）
  }
}

/* ================================================================
   圖表渲染 — 12 種工具結果自動製圖（MAIA 色彙）
   雙軸圖 → 上下雙窗格（price pane + indicator pane，單軸原則）
   ================================================================ */
const FIXED_Y = { afterFit: (s) => { s.width = 82; } };   // 加寬，讓左側價格完整顯示不被截
const _toMs = (ts) => { const n = Number(ts); return n < 1e12 ? n * 1000 : n; };   // 秒級時間戳 → 毫秒
const _fmtTs = (ms) => { const t = new Date(ms); return `${t.getMonth() + 1}/${t.getDate()} ${t.getHours()}:${String(t.getMinutes()).padStart(2, "0")}`; };

function baseScales(opts = {}) {
  return {
    y: { grid: { color: C.grid }, ticks: { color: C.ink2, font: { family: "ui-monospace, SF Mono, monospace", size: 10.5 } }, ...FIXED_Y, ...(opts.y || {}) },
    x: { grid: { display: false }, ticks: { color: C.ink3, maxRotation: 0, autoSkip: true, maxTicksLimit: 8, font: { size: 10 } }, ...(opts.x || {}) },
  };
}
const baseOpts = (extra = {}) => ({
  responsive: true, maintainAspectRatio: false,
  interaction: { mode: "index", intersect: false },
  ...extra,
});
const hline = (labels, v, label, color) => ({
  label, data: Array(labels.length).fill(v),
  borderColor: alpha(color, 0.55), borderWidth: 1, borderDash: [5, 4],
  // 給圖例一個實心色塊：fill:false 會讓圖例方塊變成空心框，一排下來看不出誰是誰
  backgroundColor: alpha(color, 0.55),
  pointRadius: 0, fill: false,
});
/* 價格上下文窗格（雙窗格圖的上半）— 帶窗格標籤，避免上下兩個 Y 軸被讀成同一條軸 */
function pricePane(labels, prices, currency = "USD") {
  return {
    height: 110,
    label: `價格 · ${currency}`,
    config: {
      type: "line",
      data: { labels, datasets: [{
        label: `價格 (${currency})`, data: prices,
        borderColor: C.accent, borderWidth: 2, pointRadius: 0, fill: true,
        backgroundColor: alpha(C.accent, .13), tension: .18,
      }]},
      options: baseOpts({
        plugins: { legend: { display: false }, tooltip: { enabled: true } },
        scales: baseScales({
          y: { ticks: { callback: compactNum, color: C.ink3, font: { family: "ui-monospace, SF Mono, monospace", size: 10 } } },
          x: { ticks: { display: false } },
        }),
      }),
    },
  };
}

/* ---------- 交易核准卡片（human-in-the-loop） ---------- */
function renderApprovalCard(step) {
  const p = step.plan || {};
  const isLive = p.mode === "live";
  const isCancelAll = p.kind === "cancel_all";
  const ttl = window.__approvalTtl || 120;
  const modeTag = `<span class="ap-mode ${isLive ? "live" : ""}">${isLive ? "🔴 實盤" : "📝 模擬盤"}</span>`;
  const hashRow = `<div class="ap-hash">計畫雜湊 · sha256:${escapeHtml((step.hash || "").slice(0, 16))}…</div>`;
  let head, body;
  if (isCancelAll) {
    head = `<span class="ap-side down">撤銷全部掛單</span>${modeTag}`;
    body = `<div class="ap-row"><span class="l">動作</span><span class="v down">撤銷『全部市場』的所有掛單</span></div>` +
           `<div class="ap-row"><span class="l">影響</span><span class="v">含止損 / 止盈保護單，撤銷後不可復原</span></div>` + hashRow;
  } else {
    const isBuy = p.side === "buy";
    const ordZh = p.ord_type === "market" ? "市價單" : `限價單 @ ${p.price}`;
    const mkt = p.market || "";
    const qSym = mkt.replace(/^[a-z]+/i, "").toUpperCase();
    const qTag = (p.est_notional_quote != null && !mkt.toLowerCase().endsWith("twd"))
      ? ` <span style="color:var(--ink-3)">(${escapeHtml(String(p.est_notional_quote))} ${escapeHtml(qSym)})</span>` : "";
    head = `<span class="ap-side ${isBuy ? "up" : "down"}">${isBuy ? "買入" : "賣出"} ${escapeHtml(mkt.toUpperCase())}</span>${modeTag}`;
    body = `<div class="ap-row"><span class="l">方向</span><span class="v ${isBuy ? "up" : "down"}">${isBuy ? "買入 BUY" : "賣出 SELL"}</span></div>` +
           `<div class="ap-row"><span class="l">數量</span><span class="v num">${escapeHtml(String(p.volume))}</span></div>` +
           `<div class="ap-row"><span class="l">類型</span><span class="v">${escapeHtml(ordZh)}</span></div>` +
           `<div class="ap-row"><span class="l">預估市價</span><span class="v num">${fmtPrice(p.latest_price || 0)}</span></div>` +
           `<div class="ap-row"><span class="l">預估金額</span><span class="v num">≈ ${fmtPrice(p.est_notional_twd || 0)} TWD${qTag}</span></div>` + hashRow;
  }
  const card = document.createElement("div");
  card.className = "approval-card";
  card.innerHTML =
    `<div class="ap-h"><span class="ap-badge">⏳ 待你核准</span>${head}</div>` +
    `<div class="ap-body">${body}</div>` +
    `<div class="ap-actions">` +
      `<button class="btn-yes">${icon("check",13)} 核准送出</button>` +
      `<button class="btn-no">取消</button>` +
      `<span class="ap-countdown" title="逾時後此核准將自動失效">${ttl}s</span>` +
    `</div>` +
    `<div class="ap-result" style="display:none"></div>`;
  threadEl.appendChild(card);
  autoScroll();

  const yes = card.querySelector(".btn-yes");
  const no = card.querySelector(".btn-no");
  const actions = card.querySelector(".ap-actions");
  const resEl = card.querySelector(".ap-result");
  const badge = card.querySelector(".ap-badge");
  const cd = card.querySelector(".ap-countdown");

  // 倒數：逾時自動停用按鈕（後端也會拒絕逾時核准）
  let remain = ttl;
  const cdTimer = setInterval(() => {
    remain -= 1;
    if (remain <= 0) {
      clearInterval(cdTimer);
      cd.textContent = "已逾時"; cd.classList.add("expired");
      if (!yes.disabled) {
        yes.disabled = no.disabled = true;
        badge.textContent = "⏱ 已逾時";
        resEl.style.display = "block";
        resEl.innerHTML = `<span class="down">此核准已逾時失效，請重新提出。</span>`;
      }
    } else {
      cd.textContent = remain + "s";
      if (remain <= 20) cd.classList.add("low");
    }
  }, 1000);

  async function resolve(url, okText, okClass) {
    clearInterval(cdTimer);
    yes.disabled = no.disabled = true;
    try {
      const r = await (await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Approval-Secret": window.__approvalSecret || "" },
        body: JSON.stringify({ token: step.token }),
      })).json();
      actions.style.display = "none";
      resEl.style.display = "block";
      const failed = r.status && !["SUCCESS", "REJECTED"].includes(r.status);
      if (failed) {
        card.classList.add("done-no");
        badge.textContent = "⚠ 未完成";
        resEl.innerHTML = `<span class="down">${escapeHtml(r.reason || r.status || "執行失敗")}</span>`;
      } else {
        card.classList.add(okClass);
        badge.textContent = okText;
        const o = r.order || {};
        resEl.innerHTML = r.status === "SUCCESS"
          ? `<span class="up">✓ 已${o.simulated ? "模擬" : "實際"}成交</span> · ${escapeHtml(String(o.side || "").toUpperCase())} ${escapeHtml(String(o.executed_volume ?? o.volume ?? ""))} @ ${fmtPrice(o.avg_price || o.price || 0)}｜手續費 ${escapeHtml(String((o.fee ?? 0)))}`
          : `<span class="down">已取消</span>`;
      }
      logTerm(failed ? "error" : "result", `訂單核准結果：${escapeHtml(r.status || "")} ${escapeHtml(r.reason || "")}`);
    } catch (e) {
      resEl.style.display = "block";
      resEl.innerHTML = `<span class="down">連線失敗：${escapeHtml(String(e))}</span>`;
      yes.disabled = no.disabled = false;
    }
  }
  yes.addEventListener("click", () => resolve("/api/approve_order", `${icon("check",13)} 已核准`, "done-yes"));
  no.addEventListener("click", () => resolve("/api/reject_order", `${icon("cross",13)} 已取消`, "done-no"));
}

/* 圖表卡片注入：建卡 → 建 canvas → 建 Chart → 記入圖表索引
   spec: { title, tag, eyebrow?, panes:[{height,label?,config,overlayHtml?}], html? } */
/* 圖表卡的 eyebrow 依類別掛上對應圖示，讓圖表卡也接進全站的圖示系統。
   用文字對應而非要求每個呼叫端傳 icon 名 —— 呼叫點分散在 30 幾處，
   逐一改動的漏改風險遠大於這裡一次對應。 */
const EYEBROW_ICON = [
  ["回測", "flask"], ["爆倉", "liquidation"], ["資金費", "funding"], ["對帳", "reconcile"],
  ["艙位", "position"], ["質押", "staking"], ["鏈上", "onchain"], ["訂單", "orderbook"],
  ["情緒", "sentiment"], ["市場", "sentiment"], ["帳戶", "wallet"], ["資金", "flow"],
  ["情報", "compass"], ["新聞", "news"], ["黃金", "trend"], ["指標", "chart"],
  ["走勢", "trend"], ["分析", "compass"], ["沙盒", "flask"],
];
function eyebrowIcon(text) {
  const t = String(text || "");
  for (const [k, name] of EYEBROW_ICON) if (t.includes(k)) return icon(name, 11);
  return icon("chart", 11);
}

function injectChartCard(spec) {
  const cardId = `chart-card-${Date.now()}-${chartCount}`;
  const card = document.createElement("div");
  card.className = "chart-card";
  card.id = cardId;
  let panesHtml = "";
  const canvasIds = [];
  (spec.panes || []).forEach((p, i) => {
    const cid = `${cardId}-c${i}`;
    canvasIds.push(cid);
    // canvas 包一層固定高度的 relative wrapper：pane-label 才不會壓縮到繪圖區
    // maxWidth：儀表這類「單一數值」的圖不該被拉滿 978px 卡寬（圖會孤零零浮在中間、
    // 兩端刻度離弧線十萬八千里）→ 收窄並置中
    const capW = p.maxWidth ? `;max-width:${p.maxWidth}px;margin-left:auto;margin-right:auto` : "";
    panesHtml += `<div class="pane">` +
      (p.label ? `<div class="pane-label">${escapeHtml(p.label)}</div>` : "") +
      `<div class="pane-canvas" style="height:${p.height}px${capW}">` +
        `<canvas id="${cid}"></canvas>${p.overlayHtml || ""}` +
      `</div>` +
    `</div>`;
  });

  card.innerHTML =
    `<div class="head">` +
      `<span class="eyebrow">${eyebrowIcon(spec.eyebrow)}${escapeHtml(spec.eyebrow || "MAIA 自動製圖")}</span>` +
      `<span class="t">${escapeHtml(spec.title)}</span>` +
      (spec.tag ? `<span class="src">${escapeHtml(spec.tag)}</span>` : "") +
    `</div>` +
    panesHtml + (spec.html || "");
  // insertAfter：讓「結論型」卡片（例如五維儀表）可以貼在答案正下方，
  // 而不是被沖到所有圖表的最後面 —— 摘要放在證據後面等於沒有摘要。
  if (spec.insertAfter && spec.insertAfter.parentNode === threadEl) {
    threadEl.insertBefore(card, spec.insertAfter.nextSibling);
  } else {
    threadEl.appendChild(card);
  }
  autoScroll();

  requestAnimationFrame(() => {
    (spec.panes || []).forEach((p, i) => {
      const ctx = document.getElementById(canvasIds[i]);
      if (ctx) new Chart(ctx.getContext("2d"), p.config);
    });
  });

  // 圖表索引（Dock）
  if (chartCount === 0) chartIndex.innerHTML = "";
  chartCount++;
  chartBadge.textContent = chartCount;
  const item = document.createElement("button");
  item.className = "cidx-item";
  item.innerHTML = `<span class="ic">📊</span><span class="t">${escapeHtml(spec.title)}</span><span class="time">${nowTime().slice(0, 5)}</span>`;
  item.addEventListener("click", () => {
    document.getElementById(cardId)?.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  chartIndex.appendChild(item);
  return card;
}

/* ---------- 12 個工具 → 圖表分支 ---------- */
let _chartSink = null;   // 有設定時，本輪新產生的圖表卡會登記進去（給答案內錨點用）
function tryRenderChart(toolName, result) {
  if (!result || typeof result !== "object") return;
  const before = threadEl.querySelectorAll(".chart-card").length;
  try { renderChartFor(toolName, result); }
  catch (e) { console.error("圖表渲染失敗", toolName, e); }
  if (_chartSink) {   // 新增了幾張就登記幾張（一個工具可能產生多張卡）
    const cards = threadEl.querySelectorAll(".chart-card");
    for (let i = before; i < cards.length; i++) _chartSink.push({ tool: toolName, card: cards[i] });
  }
}

/* ---------- 新工具（黃金 / 情緒 / 名人）→ 自訂視覺卡 ---------- */
function _pct(x, d = 1) { return (x == null || isNaN(x)) ? "—" : (Number(x) >= 0 ? "+" : "") + Number(x).toFixed(d) + "%"; }
function _num(x) { return (x == null || isNaN(x)) ? "—" : Number(x).toLocaleString(); }
function _compact(x) {
  if (x == null || isNaN(x)) return "—";
  const n = Number(x), a = Math.abs(n), s = n < 0 ? "-" : "";
  if (a >= 1e12) return s + (a / 1e12).toFixed(2) + "T";
  if (a >= 1e9) return s + (a / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return s + (a / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return s + (a / 1e3).toFixed(1) + "K";
  return s + a.toFixed(0);
}
function _fgClass(v) { v = Number(v); return v <= 25 ? "down" : v >= 55 ? "up" : ""; }
function _sigZh(s) { return s === "bullish" ? "看多" : s === "bearish" ? "看空" : "中性"; }
/* 空值就不要生磚 —— 舊版會渲染出「$—」「0 (0%)」這種空殼磚，
   使用者分不清是「沒資料」還是「真的是零」，卡片看起來像壞掉。 */
const _isEmpty = (v) => v == null || v === "" || v === "—" || v === "$—" || v === "$-";
function _tile(k, v, chg) {
  if (_isEmpty(v)) return "";
  const c = chg == null || isNaN(chg) ? "" : (Number(chg) >= 0 ? "up" : "down");
  return `<div class="viz-tile"><span class="k">${escapeHtml(k)}</span><span class="v num">${v}</span>` +
    (chg != null && !isNaN(chg) ? `<span class="chg ${c}">${_pct(chg)}</span>` : ``) + `</div>`;
}
/* 文字型磚（非數字，例如「偏向：多單被清洗」）— 同樣做空值防護 */
function _tileText(k, v) {
  if (_isEmpty(v)) return "";
  return `<div class="viz-tile"><span class="k">${escapeHtml(k)}</span><span class="v" style="font-size:13px;font-weight:700">${escapeHtml(v)}</span></div>`;
}

function _sigBadge(r) {
  if (r.low_sample) return `<span class="verdict-badge weak">樣本不足</span>`;

/* 90% 信賴區間橫條：把「異常報酬的不確定範圍」畫出來。
   區間跨過 0 → 效果方向根本不確定，這比單一平均值誠實得多。 */
function _ciBar(abn, ci) {
  if (!Array.isArray(ci) || ci.length !== 2 || ci[0] == null) return "";
  const lo = Number(ci[0]), hi = Number(ci[1]);
  const span = Math.max(Math.abs(lo), Math.abs(hi), Math.abs(abn)) * 1.25 || 1;
  const pos = (v) => ((v + span) / (2 * span)) * 100;   // 把 [-span, +span] 映射到 0–100%
  const crossesZero = lo < 0 && hi > 0;
  return `<div class="viz-sec" style="margin-top:14px">異常報酬 90% 信賴區間 ` +
    (crossesZero ? `<span class="verdict-badge none">區間跨 0</span>` : `<span class="verdict-badge strong">區間不含 0</span>`) +
    `</div>` +
    `<div class="ci"><span class="ci-zero"></span>` +
      `<span class="ci-range ${abn >= 0 ? "up" : "down"}" style="left:${pos(Math.min(lo, hi))}%;width:${Math.max(1.5, pos(Math.max(lo, hi)) - pos(Math.min(lo, hi)))}%"></span>` +
      `<span class="ci-point" style="left:${pos(abn)}%"></span>` +
    `</div>` +
    `<div class="ci-labels"><span class="num">${_pct(lo, 2)}</span><span>0%</span><span class="num">${_pct(hi, 2)}</span></div>`;
}

/* 策略匯出：呼叫 /api/export_strategy 取得 Pine/CSV 內容並觸發瀏覽器下載。
   回測結果以 window.__btResults[btId] 暫存，避免把大物件塞進 inline onclick。 */
window.__btResults = window.__btResults || {};
async function _exportStrategy(btId, fmt) {
  const r = window.__btResults[btId];
  if (!r) return;
  try {
    const body = { strategy_name: r.strategy, params: r.params || {}, format: fmt, symbol: "BTC/USDT" };
    if (fmt === "csv") body.backtest_result = r;
    const resp = await fetch("/api/export_strategy", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const d = await resp.json();
    if (d.error) { alert("匯出失敗：" + d.error); return; }
    const blob = new Blob([d.content], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = d.filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) { alert("匯出失敗：" + e); }
}

    h += `<div class="hl ${lean}" style="font-size:12.5px;margin-bottom:6px">${escapeHtml(v.verdict)}</div>`;

    }
    const wf = v.walk_forward;
    if (wf && wf.n_folds) {
      const chips = (wf.fold_returns_pct || []).map((x) => `<span class="num ${x >= 0 ? "up" : "down"}" style="margin-right:8px">${_pct(x, 1)}</span>`).join("");
      h += `<div class="stat-foot">Walk-forward ${wf.n_folds} 段樣本外：${chips} · 一致性 <b>${wf.consistency_pct}%</b>（${wf.folds_positive}/${wf.n_folds} 段為正）</div>`;

  const btId = "bt_" + chartCount + "_" + Date.now();

  h += `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">` +
    `<button style="${_bstyle}" onclick="_exportStrategy('${btId}','pine')">⬇ 匯出 TradingView Pine</button>` +
    `<button style="${_bstyle}" onclick="_exportStrategy('${btId}','csv')">⬇ 匯出交易 CSV</button>` +
  `</div>`;
  // 成本假設要跟績效放在一起：看到「總報酬 +4.6%」的人必須同時看到它建立在
  // 什麼成本模型上，否則無法判斷這個數字有多樂觀。
  const cm = r.cost_model;

         `＋ 滑價 ${(cm.slippage_rate * 100).toFixed(2)}%（單邊）· 來回共 ` +
         `<b class="num">${cm.round_trip_cost_pct}%</b>　滑價以價格滑移套用（買貴賣便宜）</div>`;
  }
  if (r.params && Object.keys(r.params).length) {
    h += `<div class="run-id">參數 ${escapeHtml(JSON.stringify(r.params))}</div>`;
  }
  h += `</div>`;
  const _pp = _backtestPricePane(r);
  injectChartCard({ title: _title("策略回測", r.strategy), tag: "Strategy Backtest", eyebrow: "回測",
                    panes: _pp ? [_pp] : [], html: h });
}

function dimSignal(toolName, r) {
  const dim = DIM_OF[toolName];
  if (!dim || !r || typeof r !== "object" || r.error) return null;
  let lean = "neutral", text = "已查";
  try {
    if (dim === "price") {
      let chg = null;
      if (toolName === "get_coingecko_coin_price") { const k = Object.keys(r)[0]; if (r[k]) chg = r[k].usd_24h_change ?? r[k].twd_24h_change; }
      else chg = r.change_24h_pct ?? r.pct ?? r.change ?? null;
      if (chg != null) { lean = chg >= 0 ? "bull" : "bear"; text = (chg >= 0 ? "+" : "") + Number(chg).toFixed(2) + "%"; }
    } else if (toolName === "detect_market_regime") {
      const rg = String(r.regime || r.market_regime || "").toLowerCase();
      lean = /bull|多|牛/.test(rg) ? "bull" : /bear|空|熊/.test(rg) ? "bear" : "neutral";
      text = r.regime || r.market_regime || "已判斷";
    } else if (toolName === "get_crypto_fear_and_greed_index") {
      const v = r.value ?? (r.data && r.data[0] && r.data[0].value);
      if (v != null) { const n = Number(v); lean = n >= 55 ? "bull" : n <= 45 ? "bear" : "neutral"; text = n + ""; }
    } else if (toolName === "analyze_crowd_sentiment") {
      const net = r.quant && r.quant.aggregate && r.quant.aggregate.net_sentiment;
      if (net != null) { lean = net > 0.1 ? "bull" : net < -0.1 ? "bear" : "neutral"; text = "淨" + (net >= 0 ? "+" : "") + net; }
    } else if (toolName === "analyze_figure_sentiment") {
      const s = r.headline_signal && r.headline_signal.signal;
      lean = s === "bullish" ? "bull" : s === "bearish" ? "bear" : "neutral"; text = s ? _sigZh(s) : "無訊號";
    } else if (dim === "derivatives") {
      let fr = r.funding_rate ?? r.avg_funding_rate ?? (r.rates && r.rates[0] && r.rates[0].rate);
      const ls = r.long_short_ratio ?? r.ratio;
      if (fr != null) { const n = Number(fr); lean = n > 0 ? "bull" : n < 0 ? "bear" : "neutral"; text = "費率" + (n >= 0 ? "+" : "") + (n * 100).toFixed(3) + "%"; }
      else if (ls != null) { const n = Number(ls); lean = n > 1 ? "bull" : n < 1 ? "bear" : "neutral"; text = "多空比 " + n.toFixed(2); }
    } else if (dim === "backtest") {
      // 事件研究回測：異常報酬（超額）才是訊號，總報酬會混進大盤 beta
      const abn = r.avg_abnormal_return_pct;
      const ret = r.strategy_return_pct ?? r.total_return_pct ?? (r.summary && r.summary.total_return_pct);
      // 新欄位是 permutation_p；舊版讀的 permutation_test.p_value_two_sided 早就不存在了
      const p = r.permutation_p ?? (r.permutation_test && r.permutation_test.p_value_two_sided);
      if (abn != null) {
        const n = Number(abn);
        // 不顯著就標中性 —— 一個 p=0.4 的正報酬不該在儀表上被畫成看多
        lean = !r.significant ? "neutral" : (n > 0 ? "bull" : n < 0 ? "bear" : "neutral");
        text = (n >= 0 ? "+" : "") + n.toFixed(1) + "%" + (p != null ? ` p=${p}` : "");
      } else if (ret != null) {
        lean = ret > 0 ? "bull" : ret < 0 ? "bear" : "neutral";
        text = (ret >= 0 ? "+" : "") + Number(ret).toFixed(1) + "%";
      } else if (p != null) { text = "p=" + p; }
    }
  } catch (e) { /* 抽取失敗就維持「已查/中性」 */ }
  return { dim, lean, text };
}
function renderFiveDim(fiveDim, anchor) {
  const dims = [["price", "價格"], ["technical", "技術"], ["derivatives", "衍生品"], ["sentiment", "情緒"], ["backtest", "回測"]];
  const filled = dims.filter(([k]) => fiveDim[k]).length;
  if (filled < 2) return;   // 至少覆蓋 2 維才值得彙整成儀表
  // 共振計數：幾維看多、幾維看空 —— 這是使用者真正想知道的「證據站在哪一邊」
  const bulls = dims.filter(([k]) => fiveDim[k] && fiveDim[k].lean === "bull").length;
  const bears = dims.filter(([k]) => fiveDim[k] && fiveDim[k].lean === "bear").length;
  const lean = bulls > bears ? "bull" : bears > bulls ? "bear" : "mixed";
  const leanZh = lean === "bull" ? "證據偏多" : lean === "bear" ? "證據偏空" : "訊號分歧";

  let h = `<div class="viz">`;
  h += `<div class="fd-verdict ${lean}"><span class="fdv-tag">${leanZh}</span>` +
    `<span class="fdv-count"><b class="up">${bulls}</b> 多 · <b class="down">${bears}</b> 空 · ${filled - bulls - bears} 中</span>` +
    `<span class="fdv-cov">覆蓋 ${filled}/5 維</span></div>`;
  h += `<div class="fivedim">`;
  dims.forEach(([k, label]) => {
    const s = fiveDim[k];
    h += `<div class="fd-tile ${s ? s.lean : "empty"}"><span class="fd-l">${label}</span>` +
      `<span class="fd-v" title="${s ? escapeHtml(s.text) : "本輪未取得此維度資料"}">${s ? escapeHtml(s.text) : "—"}</span></div>`;
  });
  h += `</div></div>`;
  injectChartCard({
    title: "五維驗證儀表", tag: "Decision", eyebrow: "決策摘要",
    panes: [], html: h, insertAfter: anchor,
  });
}

  /* 9. 跨所資金費率（正負分色柱 + 套利提示） */

    const arb = result.aggregated ? result.aggregated.arbitrage_opportunity : null;
    injectChartCard({
      title: "跨交易所資金費率", tag: "Binance · Bybit · OKX", eyebrow: "衍生品",
      panes: [{ height: 210, maxWidth: 620, label: "最新資金費率 · %（正=多方付錢給空方）", config: {
        type: "bar",
        data: { labels: exs, datasets: [{
          label: "最新資金費率 (%)", data: rates,
          backgroundColor: rates.map((v) => alpha(v >= 0 ? C.up : C.down, .65)),
          borderColor: rates.map((v) => v >= 0 ? C.up : C.down),
          borderWidth: 1.5, borderRadius: 4,
        }]},
        options: baseOpts({
          plugins: { legend: { display: false } },
          scales: baseScales({ y: { title: { display: true, text: "費率 (%)", color: C.ink3, font: { size: 10 } } } }),
        }),
      }}],
      html: arb ? `<div class="note">💡 <b>套利分析</b>　${escapeHtml(arb)}</div>` : "",
    });
  }

  /* 10. MAX 帳戶資產配置（分類色盤 doughnut） */
  else if (toolName === "get_max_accounts" && Array.isArray(result)) {
    const priceMap = { USDT: 1, USD: 1, TWD: 1 / 32.5, BTC: 60000, ETH: 3300, USDC: 1, MAX: 0.12, SOL: 140 };
    const rows = [];
    result.filter((a) => a.total > 0).forEach((a) => {
      const v = a.total * (priceMap[a.currency] || 1);
      if (v > 0.01) rows.push({ c: a.currency, v });
    });
    rows.sort((a, b) => b.v - a.v);
    const total = rows.reduce((s, r) => s + r.v, 0);
    // 顏色跟著幣種走（同幣永遠同色），未知幣種依序遞補
    const ENTITY_COLOR = { BTC: C.cat[2], ETH: C.cat[4], USDT: C.cat[1], USDC: C.cat[5], SOL: C.cat[0], DOGE: C.cat[3], TWD: C.ink3, MAX: C.accent2 };
    let fallbackIdx = 0;
    const colorOf = (cur) => ENTITY_COLOR[cur] || C.cat[fallbackIdx++ % C.cat.length];
    injectChartCard({
      title: "MAX 帳戶資產配置", tag: "MAX Private API", eyebrow: "帳戶",
      panes: [{ height: 250, maxWidth: 560, config: {
        type: "doughnut",
        data: {
          labels: rows.map((r) => `${r.c} (${(r.v / total * 100).toFixed(1)}%)`),
          datasets: [{
            data: rows.map((r) => r.v),
            backgroundColor: rows.map((r) => colorOf(r.c)),
            borderColor: C.cardBg, borderWidth: 2,
          }],
        },
        options: baseOpts({
          cutout: "62%",
          plugins: { legend: { position: "right", labels: { color: C.ink2, font: { size: 11 }, padding: 10 } } },
        }),
      }}],
      html: `<div class="note">估值合計 <b class="num">≈ $${fmtPrice(total)}</b>（以參考價粗估，非實時報價）</div>`,
    });
  }

  /* 11. 策略回測績效（累計收益曲線 + KPI 磚） */
  else if (toolName === "run_backtest" && result && result.performance) {
    const perf = result.performance;
    const trades = Array.isArray(result.recent_trades) ? result.recent_trades : [];
    const labels = ["開始"]; const curve = [0];
    let cum = 0;
    trades.forEach((t, i) => { cum += t.pnl_pct; labels.push(`#${i + 1}`); curve.push(cum); });
    const winC = curve[curve.length - 1] >= 0 ? C.up : C.down;
    const sign = (v) => (v >= 0 ? "+" : "") + v.toFixed(2) + "%";

    injectChartCard({
      title: "策略回測績效", tag: "回測引擎", eyebrow: "回測",
      panes: [{ height: 210, label: "累計收益率 · %（逐筆交易）", config: {
        type: "line",
        data: { labels, datasets: [{
          label: "策略累計收益率 (%)", data: curve,
          borderColor: winC, borderWidth: 2, fill: true,
          backgroundColor: alpha(winC, .07), pointRadius: 2.5, pointBackgroundColor: winC, tension: .12,
        }]},
        options: baseOpts({ plugins: { legend: { display: false } }, scales: baseScales() }),
      }}],
      html:
        `<div class="stat-grid">` +
        `<div class="kpi"><div class="k">策略總回報</div><div class="n num ${perf.total_return_pct >= 0 ? "up" : "down"}">${sign(perf.total_return_pct)}</div></div>` +
        `<div class="kpi"><div class="k">勝率（${perf.total_trades} 筆）</div><div class="n num">${perf.win_rate_pct.toFixed(1)}%</div></div>` +
        `<div class="kpi"><div class="k">買入持有回報</div><div class="n num ${perf.buy_and_hold_return_pct >= 0 ? "up" : "down"}">${sign(perf.buy_and_hold_return_pct)}</div></div>` +
        `<div class="kpi"><div class="k">最大回撤</div><div class="n num down">${perf.max_drawdown_pct.toFixed(2)}%</div></div>` +
        `</div>`,
    });
  }

  /* 12. 恐懼與貪婪指數（歷史→折線；單值→半圓儀表） */
  else if (toolName === "get_crypto_fear_and_greed_index" && result) {
    const history = Array.isArray(result.history) ? result.history : [];
    if (history.length > 1) {
      const d = [...history].reverse();
      const labels = d.map((x) => { const t = new Date(x.timestamp * 1000); return `${t.getMonth() + 1}/${t.getDate()}`; });
      injectChartCard({

      injectChartCard({
        title: "恐懼與貪婪指數", tag: "alternative.me", eyebrow: "市場情緒",
        panes: [],                       // 儀表用 SVG 畫，不走 Chart.js
        html: fngGaugeSvg(result),
      });
    }
  }

/* 恐懼貪婪儀表（SVG）——
   為什麼不用 Chart.js 的半圓 doughnut：它把弧線畫在「整個圓」的上半部，
   圓心固定在畫布正中央 → 畫布下半部永遠是空的，比例看起來就不對。
   SVG 可以只畫需要的區域，順便做到分區底色與指針。

   顏色跟隨使用者的漲跌設定（--up/--down）：貪婪＝偏多、恐懼＝偏空，
   語意方向與行情一致；東方紅漲配置下整條色帶會自動反過來。 */
function fngGaugeSvg(result) {
  const val = Math.max(0, Math.min(100, Number(result.latest_value ?? 50)));
  const label = String(result.latest_sentiment || "");
  // 混色：把兩個 hex 依比例混合，做出「極度→輕度」的中間階
  const mix = (a, b, t) => {
    const h = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16));
    const [r1, g1, b1] = h(a), [r2, g2, b2] = h(b);
    const c = (u, v) => Math.round(u + (v - u) * t).toString(16).padStart(2, "0");
    return `#${c(r1, r2)}${c(g1, g2)}${c(b1, b2)}`;
  };
  const down = C.down, up = C.up, warn = C.warn;
  // alternative.me 的官方分級
  const ZONES = [
    { to: 25,  color: down,                 name: "極度恐懼" },
    { to: 45,  color: mix(down, warn, .55), name: "恐懼" },
    { to: 55,  color: warn,                 name: "中性" },
    { to: 75,  color: mix(warn, up, .55),   name: "貪婪" },
    { to: 100, color: up,                   name: "極度貪婪" },
  ];
  const zone = ZONES.find((z) => val < z.to) || ZONES[ZONES.length - 1];

  const CX = 120, CY = 112, R = 90, TH = 18;   // 圓心/半徑/色帶厚度（viewBox 240×176）
  const ang = (v) => (180 - v * 1.8) * Math.PI / 180;          // 值 → 弧度（180°=0 分）
  const pt = (v, r) => [CX + r * Math.cos(ang(v)), CY - r * Math.sin(ang(v))];
  const band = (v0, v1, color) => {
    const [x0, y0] = pt(v0, R), [x1, y1] = pt(v1, R);
    const [x2, y2] = pt(v1, R - TH), [x3, y3] = pt(v0, R - TH);
    return `<path d="M${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} ` +
           `L${x2.toFixed(2)},${y2.toFixed(2)} A${R - TH},${R - TH} 0 0 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z" ` +
           `fill="${color}" opacity="0.92"/>`;
  };

  let bands = "", from = 0;
  ZONES.forEach((z) => { bands += band(from, z.to, z.color); from = z.to; });

  // 指針：指到目前數值，落在對應色區上
  const [nx, ny] = pt(val, R - TH - 7);
  const [tx, ty] = pt(val + 180, 13);          // 反向短尾，讓指針有重心
  const gid = "fng" + Math.random().toString(36).slice(2, 7);

  // 分區標籤（只標端點與中點，避免文字打架）
  const tickTxt = (v, t) => {
    const [x, y] = pt(v, R + 10);   // 色帶外側；R+13 會讓頂端「50」的字冠超出 viewBox
    const anchor = v < 20 ? "start" : v > 80 ? "end" : "middle";
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" ` +
           `font-size="9.5" fill="${C.ink3}" font-weight="600">${t}</text>`;
  };

  return `<div class="fng-wrap">
    <svg viewBox="0 0 240 176" width="100%" height="100%" role="img"
         aria-label="恐懼與貪婪指數 ${val}，${escapeHtml(label || zone.name)}">
      <defs><filter id="${gid}" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#000" flood-opacity="0.45"/>
      </filter></defs>
      ${bands}
      ${tickTxt(2, "0")}${tickTxt(50, "50")}${tickTxt(98, "100")}
      <g filter="url(#${gid})">
        <line x1="${tx.toFixed(2)}" y1="${ty.toFixed(2)}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}"
              stroke="${C.ink}" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="${CX}" cy="${CY}" r="7" fill="${C.surface3}" stroke="${C.ink}" stroke-width="2.2"/>
      </g>
      <text x="${CX}" y="${CY + 36}" text-anchor="middle" font-size="30" font-weight="800"
            fill="${zone.color}" style="font-variant-numeric:tabular-nums">${val}</text>
      <text x="${CX}" y="${CY + 52}" text-anchor="middle" font-size="11" font-weight="700"
            fill="${zone.color}">${escapeHtml(label || zone.name)}</text>
    </svg>
    <div class="fng-legend">` +
      ZONES.map((z, i) => `<span class="${z === zone ? "on" : ""}">` +
        `<i style="background:${z.color}"></i>${z.name}</span>`).join("") +
    `</div>
  </div>`;
}

<script>
/* 左側對話歷史側欄：讀 /api/conversations，點擊把問題填回輸入框、可搜尋、可開新對話 */
(function(){
  const listEl = document.getElementById("hb-list");
  const searchEl = document.getElementById("hb-search");
  const newBtn = document.getElementById("hb-new");
  const inputEl = document.getElementById("chat-input");
  if (!listEl) return;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function groupOf(ts){
    const d = (ts||"").slice(0,10);
    const today = new Date().toISOString().slice(0,10);
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    return d===today ? "今天" : (d===y ? "昨天" : "更早");
  }
  async function load(q){
    try{
      const d = await (await fetch("/api/sessions?limit=100")).json();
      let items = (d.sessions||[]);                        // 已依 updated 新到舊
      const kw = (q||"").toLowerCase();
      if(kw) items = items.filter(s => (s.title||"").toLowerCase().includes(kw));
      if(!items.length){ listEl.innerHTML = '<div class="hb-empty">還沒有對話紀錄。<br>問一個問題就會存成一段可重播的對話。</div>'; return; }
      let html = "", lastG = "";
      for(const s of items){
        const g = groupOf(s.updated);
        if(g!==lastG){ html += `<div class="hb-group">${g}</div>`; lastG = g; }
        const title = esc(s.title||"（未命名）");
        const active = (s.id === currentSessionId) ? " on" : "";
        html += `<div class="hb-item${active}" title="${title}" data-id="${esc(s.id)}">${title}</div>`;
      }
      listEl.innerHTML = html;
      listEl.querySelectorAll(".hb-item").forEach(el=>{
        el.addEventListener("click", ()=>{ const id = el.getAttribute("data-id"); if(id && typeof replaySession==="function") replaySession(id).then(()=>load(kw)); });
      });
    }catch(e){ listEl.innerHTML = '<div class="hb-empty">歷史載入失敗</div>'; }
  }
  if(newBtn) newBtn.addEventListener("click", ()=>{ if(typeof newConversation==="function") newConversation(); });
  if(searchEl){ let t; searchEl.addEventListener("input", ()=>{ clearTimeout(t); t=setTimeout(()=>load(searchEl.value.trim()), 200); }); }
  load("");
  window.__reloadHistory = () => load(searchEl ? searchEl.value.trim() : "");
})();
</script>
<script>
/* 主題切換鈕：暗/亮互換 → 寫 localStorage、更新圖示與 Chart.js 預設色 */
(function(){
  const root = document.documentElement;
  const tbtn = document.getElementById("theme-toggle");
  // 圖示由 icon() 產生，與全站同一套建構規則（原本這裡寫死 emoji，會是唯一的例外）
  const setIcon = () => { if (tbtn) tbtn.innerHTML = icon(root.getAttribute("data-theme") === "light" ? "sun" : "moon", 15); };
  setIcon();
  if (tbtn) tbtn.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("maia-theme", next); } catch (e) {}
    setIcon();
    if (window.Chart && typeof cssVar === "function") {   // 之後渲染的圖表採用新主題色（既有圖表重整後更新）
      Chart.defaults.color = cssVar("--ink-2");
      Chart.defaults.borderColor = cssVar("--grid");
    }
  });
})();
/* 漲跌顏色設定：西方(綠漲紅跌) / 東方(紅漲綠跌)。切換 data-color-convention → --up/--down 交換，
   .up/.down、跑馬燈閃爍、之後渲染的圖表全自動跟隨；寫入 localStorage 持久。 */
(function(){
  const root = document.documentElement;
  const sel = document.getElementById("color-convention");
  if (!sel) return;
  sel.value = root.getAttribute("data-color-convention") || "western";
  sel.addEventListener("change", () => {
    root.setAttribute("data-color-convention", sel.value);
    try { localStorage.setItem("maia-convention", sel.value); } catch (e) {}
    if (typeof C === "object" && typeof cssVar === "function") {   // 更新圖表色源 → 之後新圖表用新漲跌色
      C.up = cssVar("--up"); C.down = cssVar("--down");
    }
  });
})();
</script>
